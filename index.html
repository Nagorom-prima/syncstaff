<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cleaning Operations Mgt</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cleaning Ops">
<style>
:root{--bg:#0a0a0b;--card:#121214;--line:#26262b;--text:#f3f3f4;--mute:#9b9ba3;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto}
h1{font-size:2rem;line-height:1.1;margin:20px 0 4px;font-weight:800}
h2{font-size:1.1rem;margin:26px 0 10px}
.mute{color:var(--mute)}
input,select,button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
button{cursor:pointer;background:var(--text);color:#0a0a0b;font-weight:700;border:0}
button:disabled{opacity:.5}
button.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);width:auto}
:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
form{display:grid;gap:12px;margin-top:24px}
.bar{display:flex;gap:8px;align-items:center;padding-top:12px}
#co{flex:1}#out{margin-left:auto}
.live{display:flex;align-items:center;gap:8px;color:var(--mute);margin:10px 0}
.dot{width:12px;height:12px;border-radius:50%;background:#10b981;box-shadow:0 0 0 4px #10b98133}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.stat{display:flex;align-items:center;gap:12px;border:1px solid;border-radius:18px;padding:16px 14px;min-height:88px}
.stat b{display:block;font-size:2rem;line-height:1}
.stat span{color:var(--mute);font-size:.9rem}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.red{background:#1c1012;border-color:#3d1a1f}.red .ic{background:#33151a;color:#f87171}
.amber{background:#18120a;border-color:#4a3410}.amber .ic{background:#2e200b;color:#fbbf24}
.green{background:#0b1712;border-color:#134a35}.green .ic{background:#10301f;color:#34d399}
.row{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:var(--card)}
.s-Working{background:#18120a;border-color:#8a5a12}
.s-Done{background:#0b1712;border-color:#14674a}
.s-Ontheway{background:#0c1424;border-color:#1d4ed8}
.big{padding:18px;font-size:1.15rem;border-radius:18px;margin:10px 0;width:100%}
.b-blue{background:#2563eb;color:#fff}.b-amber{background:#f59e0b;color:#1a1204}.b-green{background:#10b981;color:#04140d}
.nav{display:flex;gap:8px;overflow-x:auto;margin:14px 0 4px;padding-bottom:4px}
.nav button{width:auto;white-space:nowrap;background:var(--card);color:var(--text);border:1px solid var(--line);padding:10px 14px}
.nav button.on{background:#2563eb;color:#fff;border-color:#2563eb}
.head{display:flex;align-items:center;justify-content:space-between}
label{display:grid;gap:6px;color:var(--mute);font-size:.9rem}
.tap{cursor:pointer}
.nav{display:grid;gap:6px;margin:10px 0;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.nav button{width:100%;text-align:left}
.msg{margin:12px 0;color:#f87171}
</style>
</head>
<body>
<main id="login" hidden>
  <h1>Cleaning Operations Mgt</h1>
  <p class="mute">Sign in to your company’s workspace.</p>
  <form id="lf">
    <input id="em" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button>Sign in</button>
  </form>
  <p class="msg" id="lmsg"></p>
</main>

<main id="app" hidden>
  <div class="bar">
    <button class="ghost" id="menu">☰ Menu</button>
    <select id="co" aria-label="Company"></select>
    <button class="ghost" id="tab" hidden></button>
    <button class="ghost" id="out">Sign out</button>
  </div>
  <nav class="nav" id="nav" hidden></nav>
  <h1 id="title"></h1>
  <p class="mute" id="slogan"></p>
  <p class="live" id="live"></p>
  <p class="msg" id="amsg"></p>
  <div id="body"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
// Your Supabase URL and anon key live in config.js (same folder as this file).
const CFG = window.SYNCSTAFF || {};
if (!CFG.url || !CFG.anon) {
  document.body.innerHTML = '<main><h1>Cleaning Operations Mgt</h1><p class="msg">config.js is missing or incomplete.</p></main>';
  throw new Error('config.js missing');
}
const sb = supabase.createClient(CFG.url, CFG.anon);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => t ? new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true }) : '';
const ICON = {
  way: '<svg viewBox="0 0 24 24"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',
  work: '<svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
  done: '<svg viewBox="0 0 24 24"><path d="M22 11.1V12a10 10 0 11-5.9-9.1"/><path d="M22 4L12 14l-3-3"/></svg>',
  warn: '<svg viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01"/></svg>'
};
let companies = [], companyId = null, timer = null, uid = null;
let memberships = [], staffRows = [], mode = 'dash', role = null, me = null, openLog = null;
let editing = false, isOwner = false, rowsCache = [], pick = { clients: [], staff: [], projects: [] };

function showLogin() { clearInterval(timer); $('app').hidden = true; $('login').hidden = false; }
function fail(err) { $('amsg').textContent = 'Something went wrong: ' + (err.message || err); }

async function showApp() {
  $('login').hidden = true; $('app').hidden = false;
  const { data: { user } } = await sb.auth.getUser();
  uid = user.id;
  const [co, own, mem, stf] = await Promise.all([
    sb.from('companies').select('id,company_name,slogan').order('company_name'),
    sb.rpc('is_platform_owner'),
    sb.from('memberships').select('company_id,role').eq('user_id', uid),
    sb.from('staff').select('id,company_id,full_name').eq('user_id', uid)
  ]);
  if (co.error) return fail(co.error);
  companies = co.data || []; memberships = mem.data || []; staffRows = stf.data || [];
  if (!companies.length) {
    $('title').textContent = 'No company yet';
    $('body').innerHTML = '<p class="mute">Your account is not linked to a company. Ask the platform owner to add you.</p>';
    return;
  }
  $('co').innerHTML = companies.map(c => `<option value="${c.id}">${esc(c.company_name)}</option>`).join('');
  isOwner = own.data === true; $('co').hidden = !isOwner;   // only the platform owner gets the switcher
  companyId = companies[0].id; $('co').value = companyId;
  await load();
  clearInterval(timer); timer = setInterval(() => { if (!editing) load(); }, 30000);
}

function ctx() {
  role = (memberships.find(m => m.company_id === companyId) || {}).role || null;
  me = staffRows.find(s => s.company_id === companyId) || null;
  if (role === 'staff' || (mode === 'shift' && !me)) mode = role === 'staff' ? 'shift' : 'dash';
  $('tab').hidden = !(me && role !== 'staff');
  $('tab').textContent = mode === 'shift' ? 'Dashboard' : 'My shift';
  $('menu').hidden = role === 'staff';
  if (role === 'staff') $('nav').hidden = true;
  const seeMoney = isOwner || role === 'owner' || role === 'admin';
  $('nav').innerHTML = MENU.filter(([k]) => seeMoney || !['quotes', 'finance'].includes(k))
    .map(([k, l]) => `<button class="${mode === k ? 'on' : ''}" data-nav="${k}">${l}</button>`).join('');
}

async function load() {
  const co = companies.find(c => c.id === companyId);
  if (!co) return;
  ctx();
  $('amsg').textContent = '';
  $('title').textContent = co.company_name;
  $('slogan').textContent = co.slogan || '';
  $('live').innerHTML = '<span class="dot"></span>Live · ' + esc(fmt(new Date()));
  if (role === 'staff' && !me) {
    $('body').innerHTML = '<p class="mute">Your login is not linked to a staff record yet. Ask your manager.</p>';
    return;
  }
  return mode === 'shift' ? loadShift() : mode === 'dash' ? loadDash() : mode === 'timesheets' ? loadTimesheets() : loadList(mode);
}

async function loadDash() {
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const today = new Date().toLocaleDateString('en-CA');
  const [st, lg, ui, sc, cl] = await Promise.all([
    sb.from('staff').select('id,full_name').eq('company_id', companyId),
    sb.from('staff_logs').select('*').eq('company_id', companyId)
      .gte('clock_in_time', start.toISOString()).order('clock_in_time', { ascending: false }),
    sb.from('urgent_issues').select('id', { count: 'exact', head: true })
      .eq('company_id', companyId).eq('status', 'Unresolved'),
    sb.from('schedules').select('*').eq('company_id', companyId)
      .gte('schedule_date', today).order('schedule_date').order('start_time').limit(5),
    sb.from('clients').select('id,client_name').eq('company_id', companyId)
  ]);
  const bad = [st, lg, ui, sc, cl].find(r => r.error);
  if (bad) return fail(bad.error);
  const names = Object.fromEntries((st.data || []).map(s => [s.id, s.full_name]));
  const clients = Object.fromEntries((cl.data || []).map(c => [c.id, c.client_name]));
  const logs = lg.data || [];
  const n = s => logs.filter(l => l.current_status === s).length;
  const card = (cls, ic, num, label) =>
    `<div class="stat ${cls}"><div class="ic">${ICON[ic]}</div><div><b>${num}</b><span>${label}</span></div></div>`;
  $('body').innerHTML = `
    <div class="grid">
      ${card('red', 'way', n('On the way'), 'On the way')}
      ${card('amber', 'work', n('Working'), 'Working now')}
      ${card('green', 'done', n('Done'), 'Done today')}
      ${card('red', 'warn', ui.count ?? 0, 'Urgent issues')}
    </div>
    <h2>Live staff status</h2>
    ${logs.length ? logs.map(l => `
      <div class="row s-${esc(String(l.current_status).replace(/\s/g, ''))}">
        <div><strong>${esc(names[l.staff_id] || 'Staff member')}</strong><br><span class="mute">${esc(l.current_status)}</span></div>
        <span class="mute">${esc(fmt(l.clock_in_time))}</span>
      </div>`).join('') : '<p class="mute">No staff checked in today.</p>'}
    <h2>Upcoming schedule</h2>
    ${(sc.data || []).length ? sc.data.map(s => `
      <div class="row">
        <div><strong>${esc(clients[s.client_id] || 'Client')}</strong><br><span class="mute">${esc(names[s.assigned_staff_id] || 'Unassigned')}</span></div>
        <span class="mute">${esc(s.schedule_date)}<br>${esc((s.start_time || '').slice(0, 5))}</span>
      </div>`).join('') : '<p class="mute">No upcoming jobs.</p>'}`;
}

async function loadShift() {
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const today = new Date().toLocaleDateString('en-CA');
  const [lg, sc, cl] = await Promise.all([
    sb.from('staff_logs').select('*').eq('staff_id', me.id)
      .gte('clock_in_time', start.toISOString()).order('clock_in_time', { ascending: false }),
    sb.from('schedules').select('*').eq('assigned_staff_id', me.id)
      .gte('schedule_date', today).order('schedule_date').order('start_time').limit(5),
    sb.from('clients').select('id,client_name').eq('company_id', companyId)
  ]);
  const bad = [lg, sc, cl].find(r => r.error);
  if (bad) return fail(bad.error);
  const clients = Object.fromEntries((cl.data || []).map(c => [c.id, c.client_name]));
  const logs = lg.data || [];
  openLog = logs.find(l => l.current_status !== 'Done') || null;
  const done = logs.filter(l => l.current_status === 'Done');
  let btn;
  if (!openLog) btn = '<button class="big b-blue" data-act="travel">I’m on the way</button><button class="big ghost" data-act="direct">Start work now</button>';
  else if (openLog.current_status === 'On the way') btn = '<button class="big b-amber" data-act="start">Start working</button>';
  else btn = '<button class="big b-green" data-act="finish">Mark done</button>';
  $('body').innerHTML = `
    <h2>Hello, ${esc((me.full_name || '').split(' ')[0])}</h2>
    ${openLog ? `<div class="row s-${esc(openLog.current_status.replace(/\s/g, ''))}"><strong>${esc(openLog.current_status)}</strong><span class="mute">since ${esc(fmt(openLog.clock_in_time))}</span></div>` : ''}
    ${btn}
    <button class="big ghost" style="width:100%" data-add="urgent">Report an urgent issue</button>
    <h2>My upcoming jobs</h2>
    ${(sc.data || []).length ? sc.data.map(s => `
      <div class="row"><strong>${esc(clients[s.client_id] || 'Client')}</strong>
      <span class="mute">${esc(s.schedule_date)} ${esc((s.start_time || '').slice(0, 5))}</span></div>`).join('') : '<p class="mute">No upcoming jobs.</p>'}
    <h2>Finished today</h2>
    ${done.length ? done.map(l => `
      <div class="row s-Done"><span>${esc(fmt(l.clock_in_time))} – ${esc(fmt(l.clock_out_time))}</span>
      <span class="mute">${esc(l.total_hours_logged ?? '')} h</span></div>`).join('') : '<p class="mute">Nothing finished yet.</p>'}`;
}

$('body').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]');
  if (!b || !me) return;
  b.disabled = true;
  const a = b.dataset.act, now = new Date().toISOString();
  let r;
  if (a === 'travel' || a === 'direct') {
    r = await sb.from('staff_logs').insert({ company_id: companyId, staff_id: me.id,
      current_status: a === 'travel' ? 'On the way' : 'Working', clock_in_time: now });
  } else if (a === 'start') {
    r = await sb.from('staff_logs').update({ current_status: 'Working', clock_in_time: now }).eq('id', openLog.id);
  } else {
    const hrs = Math.round((Date.now() - new Date(openLog.clock_in_time)) / 36e5 * 100) / 100;
    r = await sb.from('staff_logs').update({ current_status: 'Done', clock_out_time: now, total_hours_logged: hrs }).eq('id', openLog.id);
  }
  if (r.error) { fail(r.error); b.disabled = false; return; }
  load();
});

// ---- Pages: list, add and edit ----
const OPT = {
  status: ['Pending', 'In progress', 'Completed', 'Cancelled'],
  ptype: ['Post-Construction Cleaning', 'Industrial Cleaning'],
  priority: ['Low', 'Medium', 'High'],
  severity: ['Low', 'Medium', 'High', 'Critical'],
  ustatus: ['Unresolved', 'In progress', 'Resolved'],
  txn: ['Payment', 'Expense']
};
const MENU = [['dash', 'Dashboard'], ['projects', 'Projects'], ['schedules', 'Schedule'], ['clients', 'Clients'],
  ['staff', 'Staff'], ['urgent', 'Urgent issues'], ['timesheets', 'Timesheets'], ['quotes', 'Quotations'], ['finance', 'Finances']];
const COSTS = ['transport_fare', 'staff_feeding', 'materials_cost', 'ladder_cost', 'overhead_cost', 'staff_payment'];
const fm = n => (Number(n) || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
const ENT = {
  clients: { table: 'clients', label: 'client', title: 'Clients', order: ['client_name', true],
    fields: [['client_name', 'Name', 'text', 1], ['address', 'Address', 'text'], ['preferred_cleaning_days', 'Preferred cleaning days', 'text']],
    line: r => [r.client_name, r.address || ''] },
  staff: { table: 'staff', label: 'staff member', title: 'Staff', order: ['full_name', true],
    fields: [['full_name', 'Full name', 'text', 1], ['role', 'Role', 'text'], ['phone_number', 'Phone', 'tel'], ['shift_hours', 'Shift hours', 'text']],
    line: r => [r.full_name, [r.role, r.phone_number].filter(Boolean).join(' · ')] },
  schedules: { table: 'schedules', label: 'job', title: 'Schedule', order: ['schedule_date', false],
    fields: [['client_id', 'Client', 'pick:clients', 1], ['assigned_staff_id', 'Assigned staff', 'pick:staff'], ['schedule_date', 'Date', 'date', 1],
             ['start_time', 'Start', 'time'], ['end_time', 'End', 'time'], ['status', 'Status', 'pick:status', 0, 'Pending']],
    line: (r, L) => [L.cn[r.client_id] || 'Client', [r.schedule_date, (r.start_time || '').slice(0, 5), L.sn[r.assigned_staff_id] || 'Unassigned'].filter(Boolean).join(' · ')],
    badge: r => r.status },
  projects: { table: 'projects', label: 'project', title: 'Projects', order: ['created_at', false],
    fields: [['project_name', 'Project name', 'text', 1], ['project_type', 'Type', 'pick:ptype'], ['address', 'Address', 'text'],
             ['supervisor_id', 'Supervisor', 'pick:staff'], ['team_size', 'Team size', 'number', 0, 1],
             ['priority', 'Priority', 'pick:priority', 0, 'Medium'], ['status', 'Status', 'pick:status', 0, 'Pending']],
    line: (r, L) => [r.project_name, [r.project_type, L.sn[r.supervisor_id], r.priority].filter(Boolean).join(' · ')],
    badge: r => r.status },
  urgent: { table: 'urgent_issues', label: 'urgent issue', title: 'Urgent issues', order: ['created_at', false],
    fields: [['issue_title', 'What happened?', 'text', 1], ['description', 'Details', 'text'], ['project_id', 'Project', 'pick:projects'],
             ['severity_level', 'Severity', 'pick:severity', 0, 'Medium'], ['status', 'Status', 'pick:ustatus', 0, 'Unresolved']],
    line: (r, L) => [r.issue_title, [r.severity_level, L.pn[r.project_id]].filter(Boolean).join(' · ')],
    badge: r => r.status },
  quotes: { table: 'pricing_quotations', label: 'quotation', title: 'Quotations', order: ['created_at', false],
    fields: [['client_id', 'Client', 'pick:clients'], ['cleaning_type', 'Cleaning type', 'text', 1], ['transport_fare', 'Transport fare', 'number'],
             ['staff_feeding', 'Staff feeding', 'number'], ['materials_cost', 'Materials', 'number'], ['ladder_cost', 'Ladder', 'number'],
             ['overhead_cost', 'Overheads', 'number'], ['staff_payment', 'Staff payment', 'number'], ['profit_margin', 'Profit margin (%)', 'number']],
    compute: d => {
      COSTS.forEach(k => d[k] = d[k] || 0); d.profit_margin = d.profit_margin || 0;
      d.final_price = Math.round(COSTS.reduce((a, k) => a + d[k], 0) * (1 + d.profit_margin / 100) * 100) / 100;
    },
    line: (r, L) => [L.cn[r.client_id] || r.cleaning_type || 'Quotation', r.cleaning_type || ''],
    badge: r => fm(r.final_price) },
  finance: { table: 'financials', label: 'transaction', title: 'Finances', order: ['transaction_date', false],
    fields: [['transaction_type', 'Type', 'pick:txn', 1, 'Payment'], ['amount', 'Amount', 'number', 1], ['description', 'Description', 'text'],
             ['payment_method', 'Payment method', 'text'], ['transaction_date', 'Date', 'date', 1, new Date().toLocaleDateString('en-CA')]],
    line: r => [`${r.transaction_type}: ${fm(r.amount)}`, [r.description, r.transaction_date].filter(Boolean).join(' · ')],
    badge: r => r.payment_method || '',
    summary: rows => {
      const s = t => rows.filter(r => r.transaction_type === t).reduce((a, r) => a + Number(r.amount || 0), 0);
      const p = s('Payment'), x = s('Expense');
      return `<div class="grid"><div class="stat green"><div><b>${fm(p)}</b><span>Payments</span></div></div>
        <div class="stat red"><div><b>${fm(x)}</b><span>Expenses</span></div></div></div><p class="mute">Balance: ${fm(p - x)}</p>`;
    } }
};

async function loadList(kind) {
  const E = ENT[kind];
  const [rows, cl, st, pr] = await Promise.all([
    sb.from(E.table).select('*').eq('company_id', companyId).order(E.order[0], { ascending: E.order[1] }),
    sb.from('clients').select('id,client_name').eq('company_id', companyId).order('client_name'),
    sb.from('staff').select('id,full_name').eq('company_id', companyId).order('full_name'),
    sb.from('projects').select('id,project_name').eq('company_id', companyId).order('project_name')
  ]);
  const bad = [rows, cl, st, pr].find(r => r.error);
  if (bad) return fail(bad.error);
  pick = { clients: cl.data || [], staff: st.data || [], projects: pr.data || [] };
  rowsCache = rows.data || [];
  const L = { cn: Object.fromEntries(pick.clients.map(c => [c.id, c.client_name])),
              sn: Object.fromEntries(pick.staff.map(x => [x.id, x.full_name])),
              pn: Object.fromEntries(pick.projects.map(x => [x.id, x.project_name])) };
  $('body').innerHTML = `<div class="head"><h2>${E.title}</h2><button class="ghost" data-add="${kind}">+ Add</button></div>`
    + (E.summary ? E.summary(rowsCache) : '')
    + (rowsCache.length ? rowsCache.map((r, i) => {
        const [a, b] = E.line(r, L), g = E.badge ? E.badge(r) : '';
        return `<div class="row tap" data-edit="${i}"><div><strong>${esc(a)}</strong><br><span class="mute">${esc(b)}</span></div>${g ? `<span class="mute">${esc(g)}</span>` : ''}</div>`;
      }).join('') : '<p class="mute">Nothing here yet. Tap + Add.</p>');
}

async function loadTimesheets() {
  const from = new Date(); from.setDate(from.getDate() - 6); from.setHours(0, 0, 0, 0);
  const [lg, st] = await Promise.all([
    sb.from('staff_logs').select('staff_id,current_status,total_hours_logged').eq('company_id', companyId).gte('clock_in_time', from.toISOString()),
    sb.from('staff').select('id,full_name').eq('company_id', companyId).order('full_name')
  ]);
  const bad = [lg, st].find(r => r.error);
  if (bad) return fail(bad.error);
  let total = 0;
  const rows = (st.data || []).map(x => {
    const mine = (lg.data || []).filter(l => l.staff_id === x.id);
    const hrs = mine.reduce((a, l) => a + Number(l.total_hours_logged || 0), 0);
    total += hrs;
    return `<div class="row"><div><strong>${esc(x.full_name)}</strong><br><span class="mute">${mine.filter(l => l.current_status === 'Done').length} jobs done</span></div><strong>${hrs.toFixed(1)} h</strong></div>`;
  });
  $('body').innerHTML = `<h2>Timesheets · last 7 days</h2><p class="mute">Total: ${total.toFixed(1)} hours</p>${rows.join('') || '<p class="mute">No staff yet.</p>'}`;
}

function openForm(kind, row) {
  editing = true;
  const E = ENT[kind], r = row || {};
  const field = ([k, label, type, req, def]) => {
    const v = r[k] ?? def ?? '';
    let ctl;
    if (type.startsWith('pick:')) {
      const src = type.slice(5);
      const opts = OPT[src] ? OPT[src].map(x => [x, x]) : (pick[src] || []).map(o => [o.id, o.client_name || o.full_name || o.project_name]);
      ctl = `<select name="${k}" ${req ? 'required' : ''}><option value="">—</option>${opts.map(([id, n]) =>
        `<option value="${esc(id)}" ${String(id) === String(v) ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
    } else {
      ctl = `<input name="${k}" type="${type}" ${type === 'number' ? 'step="any" inputmode="decimal"' : ''} value="${esc(type === 'time' ? String(v).slice(0, 5) : v)}" ${req ? 'required' : ''}>`;
    }
    return `<label>${label}${req ? ' *' : ''}${ctl}</label>`;
  };
  $('body').innerHTML = `<h2>${row ? 'Edit' : 'Add'} ${E.label}</h2>
    <form id="ef" data-kind="${kind}" data-id="${row ? row.id : ''}">${E.fields.map(field).join('')}
      ${E.compute ? '<p class="mute" id="qt"></p>' : ''}
      <button class="big b-blue">Save</button>
      <button type="button" class="big ghost" style="width:100%" data-cancel="1">Cancel</button>
    </form><p class="msg" id="fmsg"></p>`;
  if (E.compute) {
    const f = $('ef');
    const upd = () => {
      const d = {};
      E.fields.forEach(([k, , t]) => { if (t === 'number') d[k] = Number(f.elements[k].value) || 0; });
      E.compute(d); $('qt').textContent = 'Final price: ' + fm(d.final_price);
    };
    f.addEventListener('input', upd); upd();
  }
}

$('body').addEventListener('click', e => {
  const t = e.target.closest('[data-add],[data-edit],[data-cancel]');
  if (!t) return;
  if (t.dataset.cancel) { editing = false; load(); }
  else if (t.dataset.add) openForm(t.dataset.add, null);
  else openForm(mode, rowsCache[Number(t.dataset.edit)]);
});

$('body').addEventListener('submit', async e => {
  const f = e.target.closest('#ef');
  if (!f) return;
  e.preventDefault();
  const kind = f.dataset.kind, id = f.dataset.id, E = ENT[kind], d = {};
  E.fields.forEach(([k, , t]) => {
    const v = f.elements[k].value.trim();
    d[k] = v === '' ? null : (k.endsWith('_id') || t === 'number') ? Number(v) : v;
  });
  if (E.compute) E.compute(d);
  const { error } = id
    ? await sb.from(E.table).update(d).eq('id', Number(id))
    : await sb.from(E.table).insert({ ...d, company_id: companyId });
  if (error) {
    $('fmsg').textContent = /row-level security/i.test(error.message)
      ? 'You do not have permission to do this.' : 'Could not save: ' + error.message;
    return;
  }
  editing = false; load();
});

$('menu').addEventListener('click', () => { $('nav').hidden = !$('nav').hidden; });
$('nav').addEventListener('click', e => {
  const b = e.target.closest('[data-nav]');
  if (!b) return;
  editing = false; $('nav').hidden = true; mode = b.dataset.nav; load();
});

$('lf').addEventListener('submit', async e => {
  e.preventDefault();
  $('lmsg').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  if (error) { $('lmsg').textContent = 'Sign-in failed: ' + error.message; return; }
  $('pw').value = '';
  showApp();
});
$('co').addEventListener('change', e => { editing = false; companyId = Number(e.target.value); load(); });
$('tab').addEventListener('click', () => { editing = false; mode = mode === 'shift' ? 'dash' : 'shift'; load(); });
$('out').addEventListener('click', async () => { await sb.auth.signOut(); showLogin(); });

(async () => {
  const { data } = await sb.auth.getSession();
  data.session ? showApp() : showLogin();
})();
</script>
</body>
</html>
