<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cleaning Operations Mgt</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cleaning Ops">
<style>
:root{--bg:#0a0a0b;--card:#121214;--line:#26262b;--text:#f3f3f4;--mute:#9b9ba3;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto}
h1{font-size:2rem;line-height:1.1;margin:20px 0 4px;font-weight:800}
h2{font-size:1.1rem;margin:26px 0 10px}
.mute{color:var(--mute)}
input,select,button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
button{cursor:pointer;background:var(--text);color:#0a0a0b;font-weight:700;border:0}
button:disabled{opacity:.5}
button.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);width:auto}
:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
form{display:grid;gap:12px;margin-top:24px}
.bar{display:flex;gap:8px;align-items:center;padding-top:12px}
#co{flex:1}#out{margin-left:auto}
.live{display:flex;align-items:center;gap:8px;color:var(--mute);margin:10px 0}
.dot{width:12px;height:12px;border-radius:50%;background:#10b981;box-shadow:0 0 0 4px #10b98133}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.stat{display:flex;align-items:center;gap:12px;border:1px solid;border-radius:18px;padding:16px 14px;min-height:88px}
.stat b{display:block;font-size:2rem;line-height:1}
.stat span{color:var(--mute);font-size:.9rem}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.red{background:#1c1012;border-color:#3d1a1f}.red .ic{background:#33151a;color:#f87171}
.amber{background:#18120a;border-color:#4a3410}.amber .ic{background:#2e200b;color:#fbbf24}
.green{background:#0b1712;border-color:#134a35}.green .ic{background:#10301f;color:#34d399}
.row{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:var(--card)}
.s-Working{background:#18120a;border-color:#8a5a12}
.s-Done{background:#0b1712;border-color:#14674a}
.s-Ontheway{background:#0c1424;border-color:#1d4ed8}
.big{padding:18px;font-size:1.15rem;border-radius:18px;margin:10px 0;width:100%}
.b-blue{background:#2563eb;color:#fff}.b-amber{background:#f59e0b;color:#1a1204}.b-green{background:#10b981;color:#04140d}
.nav{display:flex;gap:8px;overflow-x:auto;margin:14px 0 4px;padding-bottom:4px}
.nav button{width:auto;white-space:nowrap;background:var(--card);color:var(--text);border:1px solid var(--line);padding:10px 14px}
.nav button.on{background:#2563eb;color:#fff;border-color:#2563eb}
.head{display:flex;align-items:center;justify-content:space-between}
label{display:grid;gap:6px;color:var(--mute);font-size:.9rem}
.tap{cursor:pointer}
.nav{display:grid;gap:6px;margin:10px 0;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.nav button{width:100%;text-align:left}
.msg{margin:12px 0;color:#f87171}
.qt{display:grid;grid-template-columns:1fr 34px 66px 92px;gap:8px;padding:10px 8px;border-bottom:1px solid var(--line);font-size:.92rem}
.qt.h{background:#1c1c20;font-weight:700;border-radius:10px}
.qt span:last-child,.qt strong:last-child{text-align:right}
@media print{body{background:#fff}body *{visibility:hidden}#qdoc,#qdoc *{visibility:visible;color:#000!important;background:#fff!important;border-color:#bbb!important}#qdoc{position:absolute;left:0;top:0;width:100%;border:0!important}}
[data-theme=light]{--bg:#f3f7ff;--card:#ffffff;--line:#dce5f5;--text:#0b2a6f;--mute:#5d6f93;color-scheme:light}
button{color:var(--bg)}
h1{background:linear-gradient(90deg,#16a34a,#2563eb);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.stat{border-color:transparent;box-shadow:0 6px 18px rgba(0,0,0,.16)}
.stat b{color:#fff}.stat span{color:rgba(255,255,255,.92)}
.stat .ic{background:rgba(255,255,255,.25);color:#fff}
.stat.red{background:linear-gradient(135deg,#ff6b6b,#e11d74)}
.stat.amber{background:linear-gradient(135deg,#ffb020,#ff6a00)}
.stat.green{background:linear-gradient(135deg,#22c55e,#0d9488)}
.stat.blue{background:linear-gradient(135deg,#38bdf8,#4f46e5)}
.s-Working{background:rgba(245,158,11,.16);border-color:#f59e0b}
.s-Done{background:rgba(34,197,94,.16);border-color:#22c55e}
.s-Ontheway{background:rgba(56,189,248,.16);border-color:#38bdf8}
.nav button.on{background:linear-gradient(90deg,#16a34a,#2563eb);border-color:transparent}
.qt.h{background:var(--line)}
.prog{margin:4px 0 8px}.pt{display:flex;justify-content:space-between;margin-bottom:8px}
.pb{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.pb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#22c55e,#38bdf8,#a78bfa);transition:width .6s}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:99px;font-weight:700;z-index:100;white-space:nowrap}
.stat[data-go],[data-fin]{cursor:pointer}
.chip{display:inline-block;padding:6px 12px;border-radius:99px;background:var(--line);margin:0 6px 6px 0;font-size:.9rem}
</style>
</head>
<body>
<main id="login" hidden>
  <button class="ghost themebtn" type="button" style="float:right;margin-top:14px"></button>
  <h1>Cleaning Operations Mgt</h1>
  <p class="mute">Sign in to your company’s workspace.</p>
  <form id="lf">
    <input id="em" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button>Sign in</button>
  </form>
  <p class="msg" id="lmsg"></p>
</main>

<main id="app" hidden>
  <div class="bar">
    <button class="ghost" id="menu">☰ Menu</button>
    <button class="ghost themebtn" type="button"></button>
    <select id="co" aria-label="Company"></select>
    <button class="ghost" id="tab" hidden></button>
    <button class="ghost" id="out">Sign out</button>
  </div>
  <nav class="nav" id="nav" hidden></nav>
  <h1 id="title"></h1>
  <p class="mute" id="slogan"></p>
  <p class="live" id="live"></p>
  <p class="msg" id="amsg"></p>
  <div id="body"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
// Your Supabase URL and anon key live in config.js (same folder as this file).
const CFG = window.SYNCSTAFF || {};
if (!CFG.url || !CFG.anon) {
  document.body.innerHTML = '<main><h1>Cleaning Operations Mgt</h1><p class="msg">config.js is missing or incomplete.</p></main>';
  throw new Error('config.js missing');
}
const sb = supabase.createClient(CFG.url, CFG.anon);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => t ? new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true }) : '';
const ICON = {
  way: '<svg viewBox="0 0 24 24"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',
  work: '<svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
  done: '<svg viewBox="0 0 24 24"><path d="M22 11.1V12a10 10 0 11-5.9-9.1"/><path d="M22 4L12 14l-3-3"/></svg>',
  warn: '<svg viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01"/></svg>'
};
let companies = [], companyId = null, timer = null, uid = null;
let memberships = [], staffRows = [], mode = 'dash', role = null, me = null, openLog = null;
let editing = false, isOwner = false, rowsCache = [], pick = { clients: [], staff: [], projects: [] };

function showLogin() { clearInterval(timer); $('app').hidden = true; $('login').hidden = false; }
function fail(err) { $('amsg').textContent = 'Something went wrong: ' + (err.message || err); }

async function showApp() {
  $('login').hidden = true; $('app').hidden = false;
  const { data: { user } } = await sb.auth.getUser();
  uid = user.id;
  const [co, own, mem, stf] = await Promise.all([
    sb.from('companies').select('id,company_name,slogan').order('company_name'),
    sb.rpc('is_platform_owner'),
    sb.from('memberships').select('company_id,role').eq('user_id', uid),
    sb.from('staff').select('id,company_id,full_name').eq('user_id', uid)
  ]);
  if (co.error) return fail(co.error);
  companies = co.data || []; memberships = mem.data || []; staffRows = stf.data || [];
  if (!companies.length) {
    $('title').textContent = 'No company yet';
    $('body').innerHTML = '<p class="mute">Your account is not linked to a company. Ask the platform owner to add you.</p>';
    return;
  }
  $('co').innerHTML = companies.map(c => `<option value="${c.id}">${esc(c.company_name)}</option>`).join('');
  isOwner = own.data === true; $('co').hidden = !isOwner;   // only the platform owner gets the switcher
  companyId = companies[0].id; $('co').value = companyId;
  await load();
  clearInterval(timer); timer = setInterval(() => { if (!editing) load(); }, 30000);
}

function ctx() {
  role = (memberships.find(m => m.company_id === companyId) || {}).role || null;
  me = staffRows.find(s => s.company_id === companyId) || null;
  if (role === 'staff' || (mode === 'shift' && !me)) mode = role === 'staff' ? 'shift' : 'dash';
  $('tab').hidden = !(me && role !== 'staff');
  $('tab').textContent = mode === 'shift' ? 'Dashboard' : 'My shift';
  $('menu').hidden = role === 'staff';
  if (role === 'staff') $('nav').hidden = true;
  const seeMoney = isOwner || role === 'owner' || role === 'admin';
  $('nav').innerHTML = MENU.filter(([k]) => seeMoney || !['pricing', 'quotes', 'finance'].includes(k))
    .map(([k, l]) => `<button class="${mode === k ? 'on' : ''}" data-nav="${k}">${l}</button>`).join('');
}

async function load() {
  const co = companies.find(c => c.id === companyId);
  if (!co) return;
  ctx();
  $('amsg').textContent = '';
  $('title').textContent = co.company_name;
  $('slogan').textContent = co.slogan || '';
  $('live').innerHTML = '<span class="dot"></span>Live · ' + esc(fmt(new Date()));
  if (role === 'staff' && !me) {
    $('body').innerHTML = '<p class="mute">Your login is not linked to a staff record yet. Ask your manager.</p>';
    return;
  }
  if (mode !== 'pricing') qs = null;
  return mode === 'shift' ? loadShift() : mode === 'dash' ? loadDash() : mode === 'timesheets' ? loadTimesheets()
    : mode === 'pricing' ? loadPricing() : mode === 'quotes' ? loadQuotes() : mode === 'activity' ? loadActivity() : loadList(mode);
}

async function loadDash() {
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const today = new Date().toLocaleDateString('en-CA');
  const [st, lg, ui, sc, cl] = await Promise.all([
    sb.from('staff').select('id,full_name').eq('company_id', companyId),
    sb.from('staff_logs').select('*').eq('company_id', companyId)
      .gte('clock_in_time', start.toISOString()).order('clock_in_time', { ascending: false }),
    sb.from('urgent_issues').select('id', { count: 'exact', head: true })
      .eq('company_id', companyId).eq('status', 'Unresolved'),
    sb.from('schedules').select('*').eq('company_id', companyId)
      .gte('schedule_date', today).order('schedule_date').order('start_time').limit(5),
    sb.from('clients').select('id,client_name').eq('company_id', companyId)
  ]);
  const bad = [st, lg, ui, sc, cl].find(r => r.error);
  if (bad) return fail(bad.error);
  const names = Object.fromEntries((st.data || []).map(s => [s.id, s.full_name]));
  const clients = Object.fromEntries((cl.data || []).map(c => [c.id, c.client_name]));
  const logs = lg.data || [];
  const n = s => logs.filter(l => l.current_status === s).length;
  const tot = n('On the way') + n('Working') + n('Done'), pct = tot ? Math.round(n('Done') / tot * 100) : 0;
  const card = (cls, ic, num, label, go) =>
    `<div class="stat ${cls}" data-go="${go}"><div class="ic">${ICON[ic]}</div><div><b>${num}</b><span>${label} ›</span></div></div>`;
  $('body').innerHTML = `
    <h2 style="margin-top:6px">${greet()}! ${sun()}</h2>
    <div class="grid">
      ${card('blue', 'way', n('On the way'), 'On the way', 'act:On the way')}
      ${card('amber', 'work', n('Working'), 'Working now', 'act:Working')}
      ${card('green', 'done', n('Done'), 'Done today', 'act:Done')}
      ${card('red', 'warn', ui.count ?? 0, 'Urgent issues', 'urgent')}
    </div>
    <div class="prog"><div class="pt"><strong>Today’s progress</strong><strong>${pct}%</strong></div><div class="pb"><i style="width:${pct}%"></i></div>
      <p class="mute">${tot === 0 ? 'No jobs started yet. Let’s go! 🚀' : pct === 100 ? 'All done. Amazing work, team! 🎉' : 'Great work, keep it up! 💪'}</p></div>
    <h2>Live staff status</h2>
    ${logs.length ? logs.map(l => `
      <div class="row s-${esc(String(l.current_status).replace(/\s/g, ''))}">
        <div><strong>${esc(names[l.staff_id] || 'Staff member')}</strong><br><span class="mute">${esc(l.current_status)}</span></div>
        <span class="mute">${esc(fmt(l.clock_in_time))}</span>
      </div>`).join('') : '<p class="mute">No staff checked in today.</p>'}
    <h2>Upcoming schedule</h2>
    ${(sc.data || []).length ? sc.data.map(s => `
      <div class="row">
        <div><strong>${esc(clients[s.client_id] || 'Client')}</strong><br><span class="mute">${esc(names[s.assigned_staff_id] || 'Unassigned')}</span></div>
        <span class="mute">${esc(s.schedule_date)}<br>${esc((s.start_time || '').slice(0, 5))}</span>
      </div>`).join('') : '<p class="mute">No upcoming jobs.</p>'}`;
}

async function loadShift() {
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const today = new Date().toLocaleDateString('en-CA');
  const [lg, sc, cl, pr] = await Promise.all([
    sb.from('staff_logs').select('*').eq('staff_id', me.id)
      .gte('clock_in_time', start.toISOString()).order('clock_in_time', { ascending: false }),
    sb.from('schedules').select('*').eq('assigned_staff_id', me.id)
      .gte('schedule_date', today).order('schedule_date').order('start_time').limit(5),
    sb.from('clients').select('id,client_name').eq('company_id', companyId),
    sb.from('projects').select('id,project_name').eq('company_id', companyId).neq('status', 'Completed')
  ]);
  const bad = [lg, sc, cl].find(r => r.error);
  if (bad) return fail(bad.error);
  const clients = Object.fromEntries((cl.data || []).map(c => [c.id, c.client_name]));
  const logs = lg.data || [];
  openLog = logs.find(l => l.current_status !== 'Done') || null;
  const done = logs.filter(l => l.current_status === 'Done');
  const projSel = !openLog && (pr.data || []).length ? `<label>Project (optional)<select id="sproj"><option value="">—</option>${pr.data.map(x => `<option value="${x.id}">${esc(x.project_name)}</option>`).join('')}</select></label>` : '';
  let btn;
  if (!openLog) btn = '<button class="big b-blue" data-act="travel">🚗 I’m on the way</button><button class="big ghost" data-act="direct">🧽 Start work now</button>';
  else if (openLog.current_status === 'On the way') btn = '<button class="big b-amber" data-act="start">🧽 Start working</button>';
  else btn = '<button class="big b-green" data-act="finish">✅ Mark done</button>';
  $('body').innerHTML = `
    <h2>${greet()}, ${esc((me.full_name || '').split(' ')[0])}! ${sun()}</h2>
    ${openLog ? `<div class="row s-${esc(openLog.current_status.replace(/\s/g, ''))}"><strong>${esc(openLog.current_status)}</strong><span class="mute">since ${esc(fmt(openLog.clock_in_time))}</span></div>` : ''}
    ${projSel}${btn}
    <button class="big ghost" style="width:100%" data-add="urgent">Report an urgent issue</button>
    <h2>My upcoming jobs</h2>
    ${(sc.data || []).length ? sc.data.map(s => `
      <div class="row"><strong>${esc(clients[s.client_id] || 'Client')}</strong>
      <span class="mute">${esc(s.schedule_date)} ${esc((s.start_time || '').slice(0, 5))}</span></div>`).join('') : '<p class="mute">No upcoming jobs.</p>'}
    <h2>Finished today</h2>
    ${done.length ? done.map(l => `
      <div class="row s-Done"><span>${esc(fmt(l.clock_in_time))} – ${esc(fmt(l.clock_out_time))}</span>
      <span class="mute">${esc(l.total_hours_logged ?? '')} h</span></div>`).join('') : '<p class="mute">Nothing finished yet.</p>'}`;
}

$('body').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]');
  if (!b || !me) return;
  b.disabled = true;
  const a = b.dataset.act, now = new Date().toISOString();
  let r;
  if (a === 'travel' || a === 'direct') {
    r = await sb.from('staff_logs').insert({ company_id: companyId, staff_id: me.id,
      current_status: a === 'travel' ? 'On the way' : 'Working', clock_in_time: now, project_id: Number(($('sproj') || {}).value) || null });
  } else if (a === 'start') {
    r = await sb.from('staff_logs').update({ current_status: 'Working', clock_in_time: now }).eq('id', openLog.id);
  } else {
    const hrs = Math.round((Date.now() - new Date(openLog.clock_in_time)) / 36e5 * 100) / 100;
    r = await sb.from('staff_logs').update({ current_status: 'Done', clock_out_time: now, total_hours_logged: hrs }).eq('id', openLog.id);
  }
  if (r.error) { fail(r.error); b.disabled = false; return; }
  if (a === 'finish') { confetti(); toast('Job complete. Great work! 🎉'); }
  load();
});

// ---- Pages: list, add and edit ----
const OPT = {
  status: ['Pending', 'In progress', 'Completed', 'Cancelled'],
  ptype: ['Post-Construction Cleaning', 'Industrial Cleaning'],
  priority: ['Low', 'Medium', 'High'],
  severity: ['Low', 'Medium', 'High', 'Critical'],
  ustatus: ['Unresolved', 'In progress', 'Resolved'],
  txn: ['Payment', 'Expense'],
  jtype: ['Home cleaning', 'Post-construction', 'Carpet/rug wash', 'Upholstery cleaning', 'Compound/floor washing']
};
const MENU = [['dash', '📊 Dashboard'], ['projects', '🏗️ Post-Construction'], ['schedules', '📅 Schedule'], ['clients', '👥 Clients'],
  ['staff', '🧑‍🔧 Staff'], ['urgent', '🚨 Urgent issues'], ['timesheets', '⏱️ Timesheets'], ['pricing', '💰 Pricing'], ['quotes', '🧾 Quotations'], ['finance', '💳 Finances']];
const COSTS = ['transport_fare', 'staff_feeding', 'materials_cost', 'ladder_cost', 'overhead_cost', 'staff_payment'];
const fm = n => (Number(n) || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
const ENT = {
  clients: { table: 'clients', label: 'client', title: 'Clients', order: ['client_name', true],
    fields: [['client_name', 'Name', 'text', 1], ['address', 'Address', 'text'], ['preferred_cleaning_days', 'Preferred cleaning days', 'text']],
    line: r => [r.client_name, r.address || ''] },
  staff: { table: 'staff', label: 'staff member', title: 'Staff', order: ['full_name', true],
    fields: [['full_name', 'Full name', 'text', 1], ['role', 'Role', 'text'], ['phone_number', 'Phone', 'tel'], ['shift_hours', 'Shift hours', 'text']],
    line: r => [r.full_name, [r.role, r.phone_number].filter(Boolean).join(' · ')] },
  schedules: { table: 'schedules', label: 'job', title: 'Schedule', order: ['schedule_date', false],
    fields: [['client_id', 'Client', 'pick:clients', 1], ['job_type', 'Job type', 'pick:jtype'], ['assigned_staff_id', 'Assigned staff', 'pick:staff'], ['schedule_date', 'Date', 'date', 1],
             ['start_time', 'Start', 'time'], ['end_time', 'End', 'time'], ['status', 'Status', 'pick:status', 0, 'Pending']],
    line: (r, L) => [L.cn[r.client_id] || 'Client', [r.job_type, r.schedule_date, (r.start_time || '').slice(0, 5), L.sn[r.assigned_staff_id] || 'Unassigned'].filter(Boolean).join(' · ')],
    badge: r => r.status },
  projects: { table: 'projects', label: 'project', title: 'Post-Construction projects', order: ['created_at', false],
    fields: [['project_name', 'Project name', 'text', 1], ['project_type', 'Type', 'pick:ptype', 0, 'Post-Construction Cleaning'], ['address', 'Address', 'text'],
             ['supervisor_id', 'Supervisor', 'pick:staff'], ['team_size', 'Team size', 'number', 0, 1],
             ['priority', 'Priority', 'pick:priority', 0, 'Medium'], ['status', 'Status', 'pick:status', 0, 'Pending']],
    line: (r, L) => [r.project_name, [r.project_type, L.sn[r.supervisor_id], r.priority].filter(Boolean).join(' · ')],
    badge: (r, L) => [r.status, L.hrs[r.id] ? L.hrs[r.id].toFixed(1) + ' h' : ''].filter(Boolean).join(' · '),

async function loadList(kind) {

    sb.from('staff').select('id,full_name').eq('company_id', companyId).order('full_name'),

}

function openForm(kind, row) {
  editing = true;
  const E = ENT[kind], r = row || {};
  const field = ([k, label, type, req, def]) => {
    const v = r[k] ?? def ?? '';
    let ctl;
    if (type.startsWith('pick:')) {
      const src = type.slice(5);
      const opts = OPT[src] ? OPT[src].map(x => [x, x]) : (pick[src] || []).map(o => [o.id, o.client_name || o.full_name || o.project_name]);
      ctl = `<select name="${k}" ${req ? 'required' : ''}><option value="">—</option>${opts.map(([id, n]) =>
        `<option value="${esc(id)}" ${String(id) === String(v) ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
    } else {
      ctl = `<input name="${k}" type="${type}" ${type === 'number' ? 'step="any" inputmode="decimal"' : ''} value="${esc(type === 'time' ? String(v).slice(0, 5) : v)}" ${req ? 'required' : ''}>`;
    }
    return `<label>${label}${req ? ' *' : ''}${ctl}</label>`;
  };
  $('body').innerHTML = `<h2>${row ? 'Edit' : 'Add'} ${E.label}</h2>
    <form id="ef" data-kind="${kind}" data-id="${row ? row.id : ''}">${E.fields.map(field).join('')}
      ${E.compute ? '<p class="mute" id="qt"></p>' : ''}
      <button class="big b-blue">Save</button>
      <button type="button" class="big ghost" style="width:100%" data-cancel="1">Cancel</button>
    </form><p class="msg" id="fmsg"></p>`;
  if (E.compute) {
    const f = $('ef');
    const upd = () => {
      const d = {};
      E.fields.forEach(([k, , t]) => { if (t === 'number') d[k] = Number(f.elements[k].value) || 0; });
      E.compute(d); $('qt').textContent = 'Final price: ' + fm(d.final_price);
    };
    f.addEventListener('input', upd); upd();
  }
}

$('body').addEventListener('click', e => {
  const t = e.target.closest('[data-add],[data-edit],[data-cancel]');
  if (!t) return;
  if (t.dataset.cancel) { editing = false; load(); }
  else if (t.dataset.add) openForm(t.dataset.add, null);
  else if (mode === 'clients') showClient(rowsCache[Number(t.dataset.edit)]);
  else openForm(mode, rowsCache[Number(t.dataset.edit)]);
});

$('body').addEventListener('submit', async e => {
  const f = e.target.closest('#ef');
  if (!f) return;
  e.preventDefault();
  const kind = f.dataset.kind, id = f.dataset.id, E = ENT[kind], d = {};
  E.fields.forEach(([k, , t]) => {
    const v = f.elements[k].value.trim();
    d[k] = v === '' ? null : (k.endsWith('_id') || t === 'number') ? Number(v) : v;
  });
  if (E.compute) E.compute(d);
  const { error } = id
    ? await sb.from(E.table).update(d).eq('id', Number(id))
    : await sb.from(E.table).insert({ ...d, company_id: companyId });
  if (error) {
    $('fmsg').textContent = /row-level security/i.test(error.message)
      ? 'You do not have permission to do this.' : 'Could not save: ' + error.message;
    return;
  }
  editing = false; load();
});

// ---- Pricing calculator -> client quotation ----
const LV = { L: 1, M: 1.5, H: 2 };
const TYPES = {
  'Post-Construction': ['Floor washing', 'Window cleaning', 'Doors', 'Kitchen', 'Parlor', 'Passageways'],
  'Home Cleaning': ['Living room', 'Bedrooms', 'Kitchen', 'Bathrooms', 'Windows', 'Floors']
};
const COST_LABELS = [['transport_fare', 'Transport fare'], ['staff_feeding', 'Staff feeding'], ['materials_cost', 'Cost of materials used'],
  ['ladder_cost', 'Ladder hire (optional)'], ['overhead_cost', 'Overhead costs'], ['staff_payment', 'Staff payment']];
const ngn = n => '₦' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
let qs = null;

function qTotals() {
  const sub = COSTS.reduce((a, k) => a + (Number(qs.costs[k]) || 0), 0);
  const p = Number(qs.profit) || 0;
  const profit = qs.mode === '%' ? sub * p / 100 : p;
  return { sub, profit, total: Math.round((sub + profit) * 100) / 100 };
}
function spread(items, target) {
  const w = items.map(i => (Number(i.qty) || 0) * LV[i.level]);
  const sum = w.reduce((a, b) => a + b, 0) || 1;
  const amts = w.map(x => Math.round(target * x / sum * 100) / 100);
  if (amts.length) amts[amts.length - 1] = Math.round((target - amts.slice(0, -1).reduce((a, b) => a + b, 0)) * 100) / 100;
  return amts;
}

  editing = true;

      <label>Profit (${qs.mode})<span style="display:flex;gap:8px"><input name="profit" type="number" step="any" inputmode="decimal" placeholder="0" value="${esc(qs.profit)}"><button type="button" class="ghost" data-pmode="${qs.mode === '%' ? '₦' : '%'}">${qs.mode} ⇄</button></span></label></form>

function renderQuote() {
  qs.target = qTotals().total;
  $('body').innerHTML = `<div class="head"><button class="ghost" id="pback">← Edit costs</button><span class="mute">Target total<br><strong style="font-size:1.4rem;color:var(--text)">${ngn(qs.target)}</strong></span></div>
    <h2>${esc(qs.type)} quotation</h2>

    ${qs.items.map((it, i) => `<div class="row" style="display:grid;gap:8px">
      <div style="display:flex;gap:8px"><input data-qi="${i}" data-f="name" value="${esc(it.name)}" placeholder="Item"><input data-qi="${i}" data-f="qty" type="number" min="0" step="any" inputmode="decimal" placeholder="Qty" value="${esc(it.qty)}" style="width:80px"></div>
      <div style="display:flex;gap:6px;align-items:center">${['L', 'M', 'H'].map(l => `<button class="ghost" data-lv="${i},${l}" style="${it.level === l ? 'background:#2563eb;color:#fff' : ''}">${l}</button>`).join('')}<strong id="am${i}" style="margin-left:auto"></strong><button class="ghost" data-del="${i}">✕</button></div></div>`).join('')}
    <button class="ghost" data-addline="1">+ Add line item</button>

    <button class="big b-green" id="pgen">Generate Quotation</button><p class="msg" id="fmsg"></p>`;
  updAmts();
}
function updAmts() { spread(qs.items, qs.target).forEach((a, i) => { const el = $('am' + i); if (el) el.textContent = ngn(a); }); }

function qErr(err, btn) { $('fmsg').textContent = 'Could not save: ' + (err.message || err); btn.disabled = false; }
async function genQuote(btn) {
  btn.disabled = true;
  const name = qs.client.trim();
  if (!name) { $('fmsg').textContent = 'Please enter a client name.'; btn.disabled = false; return; }
  let cl = pick.clients.find(c => c.client_name.toLowerCase() === name.toLowerCase());
  if (!cl) {
    const r = await sb.from('clients').insert({ company_id: companyId, client_name: name }).select('id,client_name').single();
    if (r.error) return qErr(r.error, btn);
    cl = r.data;
  }
  const t = qTotals(), amts = spread(qs.items, t.total);
  const items = qs.items.map((it, i) => ({ name: it.name, qty: Number(it.qty) || 0, level: it.level, amount: amts[i] }));
  const pct = qs.mode === '%' ? Number(qs.profit) || 0 : (t.sub ? Math.round(t.profit / t.sub * 10000) / 100 : 0);
  const q = await sb.from('pricing_quotations').insert({ company_id: companyId, client_id: cl.id, cleaning_type: TYPE_FULL[qs.type],
    ...Object.fromEntries(COSTS.map(k => [k, Number(qs.costs[k]) || 0])), profit_margin: pct, final_price: t.total })
    .select('id,created_at').single();
  if (q.error) return qErr(q.error, btn);
  const d = await sb.from('quotation_details').insert({ company_id: companyId, pricing_quotation_id: q.data.id, client_id: cl.id, line_items: items }).select('id').single();
  if (d.error) return qErr(d.error, btn);
  confetti(); toast('Quotation ready! ✨');
  showQuote({ id: q.data.id, detailId: d.data.id, clientId: cl.id, client: cl.client_name, type: TYPE_FULL[qs.type], total: t.total, date: q.data.created_at, items });
}

const TYPE_FULL = { 'Post-Construction': 'Post-Construction Cleaning', 'Home Cleaning': 'Home Cleaning' };
const COND = { L: 'Low', M: 'Medium', H: 'High' };
let curQ = null;

    <div id="qdoc" class="row" style="display:block;padding:20px">

      <div class="qt"><span></span><span></span><strong>Total</strong><strong>${ngn(q.total)}</strong></div>
      <p class="mute" style="margin:16px 0 0;font-size:.85rem">${q.invoice ? '' : 'This quotation is valid for 30 days from the date above. '}Thank you for choosing ${esc(co)}.</p></div>`;

async function toInvoice(btn) {
  btn.disabled = true;
  const q = curQ;
  const r = await sb.from('quotation_details').update({ is_saved_as_invoice: true }).eq('id', q.detailId);
  if (r.error) { btn.disabled = false; return fail(r.error); }
  const c = await sb.from('clients').select('total_invoices_issued').eq('id', q.clientId).single();
  if (!c.error) await sb.from('clients').update({ total_invoices_issued: (c.data.total_invoices_issued || 0) + 1 }).eq('id', q.clientId);
  q.invoice = true; showQuote(q);
}

async function loadQuotes() {
  const [q, d, cl] = await Promise.all([
    sb.from('pricing_quotations').select('id,client_id,cleaning_type,final_price,created_at').eq('company_id', companyId).order('created_at', { ascending: false }),
    sb.from('quotation_details').select('id,pricing_quotation_id,line_items,is_saved_as_invoice,pdf_download_count').eq('company_id', companyId),
    sb.from('clients').select('id,client_name').eq('company_id', companyId)
  ]);
  const bad = [q, d, cl].find(r => r.error);
  if (bad) return fail(bad.error);
  const cn = Object.fromEntries((cl.data || []).map(c => [c.id, c.client_name]));
  rowsCache = (q.data || []).map(r => {
    const x = (d.data || []).find(y => y.pricing_quotation_id === r.id) || {};
    return { id: r.id, detailId: x.id, clientId: r.client_id, client: cn[r.client_id] || 'Client', type: r.cleaning_type, total: r.final_price,
      date: r.created_at, items: x.line_items || [], invoice: !!x.is_saved_as_invoice, pdf: x.pdf_download_count || 0 };
  });
  $('body').innerHTML = `<h2>Quotations</h2>` + (rowsCache.length ? rowsCache.map((r, i) => `
    <div class="row tap" data-q="${i}"><div><strong>${esc(r.client)}</strong><br><span class="mute">${esc(r.type || '')} · ${esc(new Date(r.date).toLocaleDateString('en-GB'))}${r.invoice ? ' · Invoice' : ''}</span></div><strong>${ngn(r.total)}</strong></div>`).join('')
    : '<p class="mute">No quotations yet. Create one from Pricing.</p>');
}

$('body').addEventListener('input', e => {
  if (!qs) return;
  const el = e.target, n = el.name;
  if (el.closest('#pf')) { if (n === 'profit') qs.profit = el.value; else qs.costs[n] = el.value; updBreak(); }
  else if (el.dataset.qi !== undefined) { qs.items[+el.dataset.qi][el.dataset.f] = el.value; updAmts(); }
  else if (el.id === 'qcl') qs.client = el.value;
});

$('body').addEventListener('click', e => {
  const t = e.target.closest('[data-ptype],[data-pmode],[data-lv],[data-del],[data-addline],[data-q],#pgo,#pback,#pgen,#qpdf,#qinv,#qnew');
  if (!t) return;
  const d = t.dataset;
  if (d.q !== undefined) return showQuote(rowsCache[+d.q]);
  if (t.id === 'qnew') return loadPricing();
  if (t.id === 'qinv') return toInvoice(t);
  if (t.id === 'qpdf') {
    window.print();
    if (curQ && curQ.detailId) { curQ.pdf = (curQ.pdf || 0) + 1; sb.from('quotation_details').update({ pdf_download_count: curQ.pdf }).eq('id', curQ.detailId); }
    return;
  }
  if (!qs) return;
  if (d.ptype) { qs.type = d.ptype; qs.items = []; renderCosts(); }
  else if (d.pmode) { qs.mode = d.pmode; renderCosts(); }
  else if (t.id === 'pgo') { if (!qs.items.length) qs.items = TYPES[qs.type].map(n => ({ name: n, qty: 1, level: 'M' })); renderQuote(); }
  else if (t.id === 'pback') renderCosts();
  else if (d.lv) { const [i, l] = d.lv.split(','); qs.items[+i].level = l; renderQuote(); }
  else if (d.del) { qs.items.splice(+d.del, 1); renderQuote(); }
  else if (d.addline) { qs.items.push({ name: '', qty: 1, level: 'M' }); renderQuote(); }
  else if (t.id === 'pgen') genQuote(t);
});

const greet = () => { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; };
const sun = () => { const h = new Date().getHours(); return h < 12 ? '☀️' : h < 17 ? '🌤️' : '🌙'; };
function toast(m) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = m;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function confetti() {
  const c = document.createElement('canvas');
  c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99';
  c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
  const g = c.getContext('2d'), cols = ['#22c55e', '#38bdf8', '#f59e0b', '#ec4899', '#a78bfa', '#ef4444'];
  const ps = Array.from({ length: 90 }, () => ({ x: c.width / 2, y: c.height * .6, vx: (Math.random() - .5) * 14,
    vy: -Math.random() * 16 - 4, s: 6 + Math.random() * 6, col: cols[Math.floor(Math.random() * cols.length)], r: Math.random() * 6 }));
  let f = 0;
  (function tick() {
    g.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.vy += .45; p.x += p.vx; p.y += p.vy; p.r += .2; g.save(); g.translate(p.x, p.y); g.rotate(p.r);
      g.fillStyle = p.col; g.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); g.restore(); });
    if (++f < 110) requestAnimationFrame(tick); else c.remove();
  })();
}
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t === 'light' ? '#f3f7ff' : '#0a0a0b';
  document.querySelectorAll('.themebtn').forEach(b => { b.textContent = t === 'light' ? '🌙' : '☀️'; b.setAttribute('aria-label', 'Switch theme'); });
}
let savedTheme = null; try { savedTheme = localStorage.getItem('theme'); } catch (e) {}
applyTheme(savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
document.querySelectorAll('.themebtn').forEach(b => b.addEventListener('click', () => {
  const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  try { localStorage.setItem('theme', t); } catch (e) {}
  applyTheme(t);
}));
// ---- Dashboard drill-down, client profile, finance filter ----
let actFilter = 'Working', finFilter = 'all', curClient = null;

async function loadActivity() {
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const [lg, st, pr] = await Promise.all([
    sb.from('staff_logs').select('*').eq('company_id', companyId).eq('current_status', actFilter)
      .gte('clock_in_time', start.toISOString()).order('clock_in_time', { ascending: false }),
    sb.from('staff').select('id,full_name').eq('company_id', companyId),
    sb.from('projects').select('id,project_name').eq('company_id', companyId)
  ]);
  const bad = [lg, st, pr].find(r => r.error);
  if (bad) return fail(bad.error);
  const sn = Object.fromEntries((st.data || []).map(x => [x.id, x.full_name]));
  const pn = Object.fromEntries((pr.data || []).map(x => [x.id, x.project_name]));
  const title = { 'On the way': '🚗 On the way', Working: '🧽 Working now', Done: '✅ Done today' }[actFilter] || actFilter;
  $('body').innerHTML = `<div class="head"><button class="ghost" data-go="dash">← Dashboard</button></div><h2>${title}</h2>`
    + ((lg.data || []).length ? lg.data.map(l => `
      <div class="row s-${esc(String(l.current_status).replace(/\s/g, ''))}">
        <div><strong>${esc(sn[l.staff_id] || 'Staff member')}</strong><br><span class="mute">${esc(pn[l.project_id] || 'No project')} · ${esc(fmt(l.clock_in_time))}${l.clock_out_time ? ' – ' + esc(fmt(l.clock_out_time)) : ''}</span></div>
        ${l.total_hours_logged ? `<strong>${esc(l.total_hours_logged)} h</strong>` : ''}</div>`).join('')
      : '<p class="mute">Nobody here right now. 🌤️</p>');
}

async function showClient(c) {
  editing = true; curClient = c;
  const [q, d, sc, st] = await Promise.all([
    sb.from('pricing_quotations').select('id,final_price,created_at,cleaning_type').eq('company_id', companyId).eq('client_id', c.id).order('created_at', { ascending: false }),
    sb.from('quotation_details').select('pricing_quotation_id,is_saved_as_invoice').eq('company_id', companyId).eq('client_id', c.id),
    sb.from('schedules').select('assigned_staff_id').eq('company_id', companyId).eq('client_id', c.id),
    sb.from('staff').select('id,full_name').eq('company_id', companyId)
  ]);
  const inv = (d.data || []).filter(x => x.is_saved_as_invoice).map(x => (q.data || []).find(y => y.id === x.pricing_quotation_id)).filter(Boolean);
  const sn = Object.fromEntries((st.data || []).map(x => [x.id, x.full_name]));
  const ids = [...new Set((sc.data || []).map(x => x.assigned_staff_id).filter(Boolean))];
  const total = inv.reduce((a, r) => a + Number(r.final_price || 0), 0);
  $('body').innerHTML = `<div class="head"><button class="ghost" data-go="clients">← Clients</button><button class="ghost" data-cedit="1">✏️ Edit</button></div>
    <h2 style="margin-bottom:2px">${esc(c.client_name)}</h2>
    <p class="mute" style="margin-top:0">${esc([c.address, c.preferred_cleaning_days].filter(Boolean).join(' · '))}</p>
    <h2>👷 Assigned staff</h2>${ids.length ? ids.map(id => `<span class="chip">${esc(sn[id] || 'Staff')}</span>`).join('') : '<p class="mute">No staff scheduled for this client yet.</p>'}
    <h2>🧾 Invoice history</h2><p class="mute">${inv.length} invoice${inv.length === 1 ? '' : 's'} · ${ngn(total)} total</p>
    ${inv.map(r => `<div class="row"><div><strong>INV-${String(r.id).padStart(4, '0')}</strong><br><span class="mute">${esc(r.cleaning_type || '')} · ${esc(new Date(r.created_at).toLocaleDateString('en-GB'))}</span></div><strong>${ngn(r.final_price)}</strong></div>`).join('')}`;
}

$('body').addEventListener('click', e => {
  const g = e.target.closest('[data-go],[data-fin],[data-cedit]');
  if (!g) return;
  editing = false;
  if (g.dataset.cedit) { openForm('clients', curClient); return; }
  if (g.dataset.fin) { finFilter = g.dataset.fin; load(); return; }
  const v = g.dataset.go;
  if (v.startsWith('act:')) { actFilter = v.slice(4); mode = 'activity'; } else mode = v;
  load();
});

$('menu').addEventListener('click', () => { $('nav').hidden = !$('nav').hidden; });
$('nav').addEventListener('click', e => {
  const b = e.target.closest('[data-nav]');
  if (!b) return;
  editing = false; $('nav').hidden = true; mode = b.dataset.nav; load();
});

$('lf').addEventListener('submit', async e => {
  e.preventDefault();
  $('lmsg').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  if (error) { $('lmsg').textContent = 'Sign-in failed: ' + error.message; return; }
  $('pw').value = '';
  showApp();
});
$('co').addEventListener('change', e => { editing = false; companyId = Number(e.target.value); load(); });
$('tab').addEventListener('click', () => { editing = false; mode = mode === 'shift' ? 'dash' : 'shift'; load(); });
$('out').addEventListener('click', async () => { await sb.auth.signOut(); showLogin(); });

(async () => {
  const { data } = await sb.auth.getSession();
  data.session ? showApp() : showLogin();
})();
</script>
