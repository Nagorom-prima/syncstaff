<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cleaning Operations Mgt</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cleaning Ops">
<style>
:root{--bg:#0a0a0b;--card:#121214;--line:#26262b;--text:#f3f3f4;--mute:#9b9ba3;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto}
h1{font-size:2rem;line-height:1.1;margin:20px 0 4px;font-weight:800}
h2{font-size:1.1rem;margin:26px 0 10px}
.mute{color:var(--mute)}
input,select,button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
button{cursor:pointer;background:var(--text);color:#0a0a0b;font-weight:700;border:0}
button:disabled{opacity:.5}
button.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);width:auto}
:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
form{display:grid;gap:12px;margin-top:24px}
.bar{display:flex;gap:8px;align-items:center;padding-top:12px}
#co{flex:1}#out{margin-left:auto}
.live{display:flex;align-items:center;gap:8px;color:var(--mute);margin:10px 0}
.dot{width:12px;height:12px;border-radius:50%;background:#10b981;box-shadow:0 0 0 4px #10b98133}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.stat{display:flex;align-items:center;gap:12px;border:1px solid;border-radius:18px;padding:16px 14px;min-height:88px}
.stat b{display:block;font-size:2rem;line-height:1}
.stat span{color:var(--mute);font-size:.9rem}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.red{background:#1c1012;border-color:#3d1a1f}.red .ic{background:#33151a;color:#f87171}
.amber{background:#18120a;border-color:#4a3410}.amber .ic{background:#2e200b;color:#fbbf24}
.green{background:#0b1712;border-color:#134a35}.green .ic{background:#10301f;color:#34d399}
.row{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:var(--card)}
.s-Working{background:#18120a;border-color:#8a5a12}
.s-Done{background:#0b1712;border-color:#14674a}
.s-Ontheway{background:#0c1424;border-color:#1d4ed8}
.big{padding:18px;font-size:1.15rem;border-radius:18px;margin:10px 0;width:100%}
.b-blue{background:#2563eb;color:#fff}.b-amber{background:#f59e0b;color:#1a1204}.b-green{background:#10b981;color:#04140d}
.nav{display:flex;gap:8px;overflow-x:auto;margin:14px 0 4px;padding-bottom:4px}
.nav button{width:auto;white-space:nowrap;background:var(--card);color:var(--text);border:1px solid var(--line);padding:10px 14px}
.nav button.on{background:#2563eb;color:#fff;border-color:#2563eb}
.head{display:flex;align-items:center;justify-content:space-between}
label{display:grid;gap:6px;color:var(--mute);font-size:.9rem}
.tap{cursor:pointer}
.nav{display:grid;gap:6px;margin:10px 0;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.nav button{width:100%;text-align:left}
.msg{margin:12px 0;color:#f87171}
.qt{display:grid;grid-template-columns:1fr 34px 66px 92px;gap:8px;padding:10px 8px;border-bottom:1px solid var(--line);font-size:.92rem}
.qt.h{background:#1c1c20;font-weight:700;border-radius:10px}
.qt span:last-child,.qt strong:last-child{text-align:right}
@media print{body{background:#fff}body *{visibility:hidden}#qdoc,#qdoc *{visibility:visible;color:#000!important;background:#fff!important;border-color:#bbb!important}#qdoc{position:absolute;left:0;top:0;width:100%;border:0!important}}
[data-theme=light]{--bg:#f3f7ff;--card:#ffffff;--line:#dce5f5;--text:#0b2a6f;--mute:#5d6f93;color-scheme:light}
button{color:var(--bg)}
h1{background:linear-gradient(90deg,#16a34a,#2563eb);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.stat{border-color:transparent;box-shadow:0 6px 18px rgba(0,0,0,.16)}
.stat b{color:#fff}.stat span{color:rgba(255,255,255,.92)}
.stat .ic{background:rgba(255,255,255,.25);color:#fff}
.stat.red{background:linear-gradient(135deg,#ff6b6b,#e11d74)}
.stat.amber{background:linear-gradient(135deg,#ffb020,#ff6a00)}
.stat.green{background:linear-gradient(135deg,#22c55e,#0d9488)}
.stat.blue{background:linear-gradient(135deg,#38bdf8,#4f46e5)}
.s-Working{background:rgba(245,158,11,.16);border-color:#f59e0b}
.s-Done{background:rgba(34,197,94,.16);border-color:#22c55e}
.s-Ontheway{background:rgba(56,189,248,.16);border-color:#38bdf8}
.nav button.on{background:linear-gradient(90deg,#16a34a,#2563eb);border-color:transparent}
.qt.h{background:var(--line)}
.prog{margin:4px 0 8px}.pt{display:flex;justify-content:space-between;margin-bottom:8px}
.pb{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.pb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#22c55e,#38bdf8,#a78bfa);transition:width .6s}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:99px;font-weight:700;z-index:100;white-space:nowrap}
.stat[data-go],[data-fin]{cursor:pointer}
.chip{display:inline-block;padding:6px 12px;border-radius:99px;background:var(--line);margin:0 6px 6px 0;font-size:.9rem}
.av{border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#22c55e,#38bdf8);color:#fff;font-weight:700;flex:none;overflow:hidden}
a{color:#38bdf8}
.qt.c3{grid-template-columns:1fr 34px 100px}
details{margin:8px 0}summary{cursor:pointer;font-weight:700}details p{margin:6px 0}
.med{width:auto;padding:14px 34px;font-size:1.05rem;border-radius:16px;margin:12px 0}
</style>
</head>
<body>
<main id="login" hidden>
  <button class="ghost themebtn" type="button" style="float:right;margin-top:14px"></button>
  <h1>Cleaning Operations Mgt</h1>
  <p class="mute">Sign in to your company’s workspace.</p>
  <form id="lf">
    <input id="em" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button>Sign in</button>
  </form>
  <form id="sf" hidden>
    <input id="sem" type="email" placeholder="Your email" autocomplete="username" required>
    <input id="spw" type="password" placeholder="Choose a password (8+ characters)" autocomplete="new-password" required>
    <button>Create account</button>
  </form>
  <p class="msg" id="lmsg"></p>
  <p class="mute">New cleaning agency? <a href="#" id="tosignup">Create an account</a></p>
</main>

<main id="app" hidden>
  <div class="bar">
    <button class="ghost" id="menu">☰ Menu</button>
    <button class="ghost themebtn" type="button"></button>
    <select id="co" aria-label="Company"></select>
    <button class="ghost" id="tab" hidden></button>
    <button class="ghost" id="out">Sign out</button>
  </div>
  <nav class="nav" id="nav" hidden></nav>
  <h1 id="title"></h1>
  <p class="mute" id="slogan"></p>
  <p class="live" id="live"></p>
  <p class="msg" id="amsg"></p>
  <div id="body"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
// Your Supabase URL and anon key live in config.js (same folder as this file).
const CFG = window.SYNCSTAFF || {};
if (!CFG.url || !CFG.anon) {
  document.body.innerHTML = '<main><h1>Cleaning Operations Mgt</h1><p class="msg">config.js is missing or incomplete.</p></main>';
  throw new Error('config.js missing');
}
const sb = supabase.createClient(CFG.url, CFG.anon);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => t ? new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true }) : '';
const ICON = {
  way: '<svg viewBox="0 0 24 24"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',
  work: '<svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
  done: '<svg viewBox="0 0 24 24"><path d="M22 11.1V12a10 10 0 11-5.9-9.1"/><path d="M22 4L12 14l-3-3"/></svg>',
  warn: '<svg viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01"/></svg>'
};
let companies = [], companyId = null, timer = null, uid = null;
let memberships = [], staffRows = [], mode = 'dash', role = null, me = null, openLog = null;
let editing = false, isOwner = false, rowsCache = [], pick = { clients: [], staff: [], projects: [] };

function showLogin() { clearInterval(timer); $('app').hidden = true; $('login').hidden = false; }
function fail(err) { $('amsg').textContent = 'Something went wrong: ' + (err.message || err); }

async function showApp() {
  $('login').hidden = true; $('app').hidden = false;
  const { data: { user } } = await sb.auth.getUser();
  uid = user.id;
  const [co, own, mem, stf] = await Promise.all([
    sb.from('companies').select('id,company_name,slogan,logo_url,phone,address,bank_details,payment_terms,status').order('company_name'),
    sb.rpc('is_platform_owner'),
    sb.from('memberships').select('company_id,role').eq('user_id', uid),
    sb.from('staff').select('id,company_id,full_name,photo_url,status,days_to_pay').eq('user_id', uid)
  ]);
  if (co.error) return fail(co.error);
  companies = co.data || []; memberships = mem.data || []; staffRows = stf.data || [];
  if (!companies.length) {
    $('title').textContent = 'Welcome';
    $('menu').hidden = true;
    const jr = await sb.from('join_requests').select('status').eq('user_id', uid).order('created_at', { ascending: false }).limit(1);
    const last = (jr.data || [])[0];
    $('body').innerHTML = last && last.status === 'pending'
      ? '<div class="row s-Working">⏳ Your request was sent. Your manager needs to approve it. Reload this page after they do.</div>'
      : `<p class="mute">Your account is not linked to a company yet.</p>
        <button class="big b-green" data-reg="1">🏢 I own a cleaning agency: register it</button>
        <button class="big ghost" style="width:100%" data-join="1">🔑 I’m staff: join with my agency’s code</button>
        ${last && last.status === 'rejected' ? '<p class="msg">Your last request was not approved.</p>' : ''}`;
    return;
  }
  $('co').innerHTML = companies.map(c => `<option value="${c.id}">${esc(c.company_name)}</option>`).join('');
  isOwner = own.data === true; $('co').hidden = !isOwner;
  if (!isOwner && companies.every(c => c.status && c.status !== 'active')) {
    $('menu').hidden = true;
    $('title').textContent = companies[0].company_name;
 $('body').innerHTML = companies[0].status === 'inactive'
      ? '<p class="mute">This agency is currently inactive. Please contact the platform owner.</p>'
      : companies[0].status === 'rejected'
      ? '<p class="mute">Your registration was not approved. Please contact the platform owner.</p>'
      : '<div class="row s-Working">⏳ Your agency is waiting for approval. Reload this page once you have been approved.</div>';
    return;
  }   // only the platform owner gets the switcher
  companyId = companies[0].id; $('co').value = companyId;
  await load();
  clearInterval(timer); timer = setInterval(() => { if (!editing) load(); }, 30000);
}

function ctx() {
  role = (memberships.find(m => m.company_id === companyId) || {}).role || null;
  me = staffRows.find(s => s.company_id === companyId) || null;
  if (role === 'staff' || (mode === 'shift' && !me)) mode = role === 'staff' ? 'shift' : 'dash';
  $('tab').hidden = !(me && role !== 'staff');
  $('tab').textContent = mode === 'shift' ? 'Dashboard' : 'My shift';
  $('menu').hidden = role === 'staff';
  if (role === 'staff') $('nav').hidden = true;
  const seeMoney = isOwner || role === 'owner' || role === 'admin';
  $('nav').innerHTML = MENU.filter(([k]) => (seeMoney || !['pricing', 'quotes', 'invoices', 'payroll', 'finance', 'company', 'joins'].includes(k)) && (!['approvals', 'agencies'].includes(k) || isOwner))
    .map(([k, l]) => `<button class="${mode === k ? 'on' : ''}" data-nav="${k}">${l}</button>`).join('');
}

async function load() {
  const co = companies.find(c => c.id === companyId);
  if (!co) return;
  ctx();
  $('amsg').textContent = '';
  $('title').textContent = co.company_name;
  $('slogan').textContent = co.slogan || '';
  $('live').innerHTML = '<span class="dot"></span>Live · ' + esc(fmt(new Date()));
  if (role === 'staff' && !me) {
    $('body').innerHTML = '<p class="mute">Your login is not linked to a staff record yet. Ask your manager.</p>';
    return;
  }
  if (role === 'staff' && me && me.status === 'Terminated') {
    $('body').innerHTML = '<p class="mute">Your staff account is inactive. Please contact your manager.</p>';
    return;
  }
  if (mode !== 'pricing') qs = null;
  return mode === 'shift' ? loadShift() : mode === 'dash' ? loadDash() : mode === 'timesheets' ? loadTimesheets()
    : mode === 'pricing' ? loadPricing() : mode === 'quotes' ? loadQuotes() : mode === 'activity' ? loadActivity() : mode === 'home' ? loadHome() : mode === 'invoices' ? loadQuotes(true) : mode === 'payroll' ? loadPayroll() : mode === 'company' ? loadCompany() : mode === 'approvals' ? loadApprovals() : mode === 'joins' ? loadJoins() : mode === 'agencies' ? loadAgencies() : mode === 'findetail' ? loadFinDetail() : loadList(mode);
}

async function loadDash() {
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const today = new Date().toLocaleDateString('en-CA');
  const [st, lg, ui, sc, cl] = await Promise.all([
    sb.from('staff').select('id,full_name').eq('company_id', companyId),
    sb.from('staff_logs').select('*').eq('company_id', companyId)
      .gte('clock_in_time', start.toISOString()).order('clock_in_time', { ascending: false }),
    sb.from('urgent_issues').select('id', { count: 'exact', head: true })
      .eq('company_id', companyId).eq('status', 'Unresolved'),
    sb.from('schedules').select('*').eq('company_id', companyId)
      .gte('schedule_date', today).order('schedule_date').order('start_time').limit(5),
    sb.from('clients').select('id,client_name').eq('company_id', companyId)
  ]);
  const bad = [st, lg, ui, sc, cl].find(r => r.error);
  if (bad) return fail(bad.error);
  const names = Object.fromEntries((st.data || []).map(s => [s.id, s.full_name]));
  const clients = Object.fromEntries((cl.data || []).map(c => [c.id, c.client_name]));
  const logs = lg.data || [];
  const n = s => logs.filter(l => l.current_status === s).length;
  let banners = '';
  if (isOwner || role === 'owner' || role === 'admin') {
    const [P, iv] = await Promise.all([payrollData(), sb.from('quotation_details').select('invoice_status').eq('company_id', companyId).eq('is_saved_as_invoice', true)]);
    const due = (P.rows || []).filter(r => r.ready).length, open = (iv.data || []).filter(x => x.invoice_status !== 'Paid').length;
    if (due) banners += `<div class="row s-Working" data-go="payroll" style="cursor:pointer">💸 ${due} staff member${due > 1 ? 's have' : ' has'} completed their work days. Payment is due ›</div>`;
    if (open) banners += `<div class="row s-Ontheway" data-go="invoices" style="cursor:pointer">📨 ${open} invoice${open > 1 ? 's' : ''} awaiting payment ›</div>`;
    const jc = await sb.from('join_requests').select('id', { count: 'exact', head: true }).eq('company_id', companyId).eq('status', 'pending');
    if (jc.count) banners += `<div class="row s-Working" data-go="joins" style="cursor:pointer">🙋 ${jc.count} staff request${jc.count > 1 ? 's are' : ' is'} waiting for your approval ›</div>`;
  }
  (sc.data || []).forEach(x => {
    if (!x.start_time || ['Completed', 'Cancelled'].includes(x.status)) return;
    const hrs = (new Date(x.schedule_date + 'T' + x.start_time).getTime() - Date.now()) / 36e5;
    if (hrs <= 0 || hrs > 10) return;
    banners += `<div class="row ${hrs <= 5 ? 's-Working' : 's-Ontheway'}" data-go="schedules" style="cursor:pointer">⏰ ${esc(clients[x.client_id] || 'A client')} (${esc(x.job_type || 'job')}) starts in ${hrs < 1 ? 'under an hour' : 'about ' + Math.round(hrs) + ' h'}${x.assigned_staff_id ? '' : ' · no staff assigned!'} ›</div>`;
  });
  if (isOwner) {
    const pc = await sb.from('companies').select('id', { count: 'exact', head: true }).eq('status', 'pending');
    if (pc.count) banners += `<div class="row s-Working" data-go="approvals" style="cursor:pointer">🛂 ${pc.count} agenc${pc.count > 1 ? 'ies are' : 'y is'} waiting for approval ›</div>`;
  }
  const tot = n('On the way') + n('Working') + n('Done'), pct = tot ? Math.round(n('Done') / tot * 100) : 0;
  const card = (cls, ic, num, label, go) =>
    `<div class="stat ${cls}" data-go="${go}"><div class="ic">${ICON[ic]}</div><div><b>${num}</b><span>${label} ›</span></div></div>`;
  $('body').innerHTML = `
    <h2 style="margin-top:6px">${greet()}! ${sun()}</h2>
    ${banners}
    <div class="grid">
      ${card('blue', 'way', n('On the way'), 'On the way', 'act:On the way')}
      ${card('amber', 'work', n('Working'), 'Working now', 'act:Working')}
      ${card('green', 'done', n('Done'), 'Done today', 'act:Done')}
      ${card('red', 'warn', ui.count ?? 0, 'Urgent issues', 'urgent')}
    </div>
    <div class="prog"><div class="pt"><strong>Today’s progress</strong><strong>${pct}%</strong></div><div class="pb"><i style="width:${pct}%"></i></div>
      <p class="mute">${tot === 0 ? 'No jobs started yet. Let’s go! 🚀' : pct === 100 ? 'All done. Amazing work, team! 🎉' : 'Great work, keep it up! 💪'}</p></div>
    <h2>Live staff status</h2>
    ${logs.length ? logs.map(l => `
      <div class="row s-${esc(String(l.current_status).replace(/\s/g, ''))}">
        <div><strong>${esc(names[l.staff_id] || 'Staff member')}</strong><br><span class="mute">${esc(l.current_status)}</span></div>
        <span class="mute">${esc(fmt(l.clock_in_time))}</span>
      </div>`).join('') : '<p class="mute">No staff checked in today.</p>'}
    <h2>Upcoming schedule</h2>
    ${(sc.data || []).length ? sc.data.map(s => `
      <div class="row">
        <div><strong>${esc(clients[s.client_id] || 'Client')}</strong><br><span class="mute">${esc(names[s.assigned_staff_id] || 'Unassigned')}</span></div>
        <span class="mute">${esc(s.schedule_date)}<br>${esc((s.start_time || '').slice(0, 5))}</span>
      </div>`).join('') : '<p class="mute">No upcoming jobs.</p>'}`;
}

async function loadShift() {
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const today = new Date().toLocaleDateString('en-CA');
  const [lg, sc, cl, pr, mp, md] = await Promise.all([
    sb.from('staff_logs').select('*').eq('staff_id', me.id)
      .gte('clock_in_time', start.toISOString()).order('clock_in_time', { ascending: false }),
    sb.from('schedules').select('*').eq('assigned_staff_id', me.id)
      .gte('schedule_date', today).order('schedule_date').order('start_time').limit(5),
    sb.from('clients').select('id,client_name').eq('company_id', companyId),
    sb.from('projects').select('id,project_name').eq('company_id', companyId).neq('status', 'Completed'),
    sb.from('payroll').select('status').eq('staff_id', me.id).eq('pay_period_start', monthInfo().startStr),
    sb.from('staff_logs').select('clock_in_time').eq('staff_id', me.id).eq('current_status', 'Done').gte('clock_in_time', monthInfo().start.toISOString())
  ]);
  const bad = [lg, sc, cl].find(r => r.error);
  if (bad) return fail(bad.error);
  const clients = Object.fromEntries((cl.data || []).map(c => [c.id, c.client_name]));
  const logs = lg.data || [];
  openLog = logs.find(l => l.current_status !== 'Done') || null;
  const done = logs.filter(l => l.current_status === 'Done');
  const projSel = !openLog ? `<label>Job type<select id="sjt">${OPT.jtype.map(j => `<option>${j}</option>`).join('')}</select></label>
    <label>Client (optional)<select id="scl"><option value="">—</option>${(cl.data || []).map(c => `<option value="${c.id}">${esc(c.client_name)}</option>`).join('')}</select></label>
    ${(pr.data || []).length ? `<label>Project (optional)<select id="sproj"><option value="">—</option>${pr.data.map(x => `<option value="${x.id}">${esc(x.project_name)}</option>`).join('')}</select></label>` : ''}` : '';
  const paidNow = (mp.data || []).some(x => x.status === 'Paid'), mdays = workDays(md.data || []);
  const banner = paidNow ? '<div class="row s-Done">🎉 Month completed! Your payment has been made.</div>'
    : me.days_to_pay ? `<div class="row s-Ontheway">📅 ${mdays} / ${me.days_to_pay} work days this month</div>` : '';
  let btn;
  if (!openLog) btn = `<button class="med b-green" id="cibtn" type="button">✅ Check in</button>

$('body').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]');
  if (!b || !me) return;
  b.disabled = true;
  const a = b.dataset.act, now = new Date().toISOString();
  let r, pos = null;
  if (a !== 'finish') { toast('Getting your location 📍'); pos = await getPos(); }
  if (a === 'travel' || a === 'direct') {
    r = await sb.from('staff_logs').insert({ company_id: companyId, staff_id: me.id,
      current_status: a === 'travel' ? 'On the way' : 'Working', clock_in_time: now, project_id: Number(($('sproj') || {}).value) || null,
      client_id: Number(($('scl') || {}).value) || null, job_type: ($('sjt') || {}).value || null,
      latitude: pos ? pos.lat : null, longitude: pos ? pos.lng : null });
  } else if (a === 'start') {
    r = await sb.from('staff_logs').update({ current_status: 'Working', clock_in_time: now, ...(pos ? { latitude: pos.lat, longitude: pos.lng } : {}) }).eq('id', openLog.id);
  } else {
    const hrs = Math.round((Date.now() - new Date(openLog.clock_in_time)) / 36e5 * 100) / 100;
    r = await sb.from('staff_logs').update({ current_status: 'Done', clock_out_time: now, total_hours_logged: hrs }).eq('id', openLog.id);
  }
  if (r.error) { fail(r.error); b.disabled = false; return; }
  if (a === 'finish') { confetti(); toast('Job complete. Great work! 🎉'); }
  load();
});

  ]);

function openForm(kind, row) {

      const src = type.slice(5);
      const opts = OPT[src] ? OPT[src].map(x => [x, x]) : (pick[src] || []).filter(o => o.status !== 'Terminated').map(o => [o.id, o.client_name || o.full_name || o.project_name]);
      ctl = `<select name="${k}" ${req ? 'required' : ''}><option value="">—</option>${opts.map(([id, n]) =>
        `<option value="${esc(id)}" ${String(id) === String(v) ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
    } else if (type === 'photo') {
      ctl = '<input name="photo" type="file" accept="image/*">';
    } else {
      ctl = `<input name="${k}" type="${type}" ${type === 'number' ? 'step="any" inputmode="decimal"' : ''} value="${esc(type === 'time' ? String(v).slice(0, 5) : v)}" ${req ? 'required' : ''}>`;
    }
    return `<label>${label}${req ? ' *' : ''}${ctl}</label>`;

    <form id="ef" data-kind="${kind}" data-id="${row ? row.id : ''}">${E.fields.map(field).join('')}
      ${E.compute ? '<p class="mute" id="qt"></p>' : ''}

      <button type="button" class="big ghost" style="width:100%" data-cancel="1">Cancel</button>

  if (E.compute) {
    const f = $('ef');

    };
    f.addEventListener('input', upd); upd();
  }
}

// ---- Pricing calculator -> client quotation ----
const LV = { L: 1, M: 1.5, H: 2 };
const TYPES = {
  'Post-Construction': ['Floor washing', 'Window cleaning', 'Doors', 'Kitchen', 'Parlor', 'Passageways'],
  'Home Cleaning': ['Living room', 'Bedrooms', 'Kitchen', 'Bathrooms', 'Windows', 'Floors']
};
const COST_LABELS = [['transport_fare', 'Transport fare'], ['staff_feeding', 'Staff feeding'], ['materials_cost', 'Cost of materials used'],
  ['ladder_cost', 'Ladder hire (optional)'], ['overhead_cost', 'Overhead costs'], ['staff_payment', 'Staff payment']];
const ngn = n => '₦' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
let qs = null;

function qTotals() {
  const sub = COSTS.reduce((a, k) => a + (Number(qs.costs[k]) || 0), 0);
  const p = Number(qs.profit) || 0;
  const profit = qs.mode === '%' ? sub * p / 100 : p;
  return { sub, profit, total: Math.round((sub + profit) * 100) / 100 };
}
function spread(items, target) {
  const w = items.map(i => (Number(i.qty) || 0) * LV[i.level]);
  const sum = w.reduce((a, b) => a + b, 0) || 1;
  const amts = w.map(x => Math.round(target * x / sum * 100) / 100);
  if (amts.length) amts[amts.length - 1] = Math.round((target - amts.slice(0, -1).reduce((a, b) => a + b, 0)) * 100) / 100;
  return amts;
}

      <div style="display:flex;gap:8px"><input data-qi="${i}" data-f="name" value="${esc(it.name)}" placeholder="Item"><input data-qi="${i}" data-f="qty" type="number" min="0" step="any" inputmode="decimal" placeholder="Qty" value="${esc(it.qty)}" style="width:80px"></div>
      <div style="display:flex;gap:6px;align-items:center">${['L', 'M', 'H'].map(l => `<button class="ghost" data-lv="${i},${l}" style="${it.level === l ? 'background:#2563eb;color:#fff' : ''}">${l}</button>`).join('')}<strong id="am${i}" style="margin-left:auto"></strong><button class="ghost" data-del="${i}">✕</button></div></div>`).join('')}

function qErr(err, btn) { $('fmsg').textContent = 'Could not save: ' + (err.message || err); btn.disabled = false; }
async function genQuote(btn) {
  btn.disabled = true;
  const name = qs.client.trim();
  if (!name) { $('fmsg').textContent = 'Please enter a client name.'; btn.disabled = false; return; }
  let cl = pick.clients.find(c => c.client_name.toLowerCase() === name.toLowerCase());
  if (!cl) {
    const r = await sb.from('clients').insert({ company_id: companyId, client_name: name }).select('id,client_name').single();
    if (r.error) return qErr(r.error, btn);

function toast(m) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = m;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function confetti() {
  const c = document.createElement('canvas');
  c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99';
  c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
  const g = c.getContext('2d'), cols = ['#22c55e', '#38bdf8', '#f59e0b', '#ec4899', '#a78bfa', '#ef4444'];
  const ps = Array.from({ length: 90 }, () => ({ x: c.width / 2, y: c.height * .6, vx: (Math.random() - .5) * 14,
    vy: -Math.random() * 16 - 4, s: 6 + Math.random() * 6, col: cols[Math.floor(Math.random() * cols.length)], r: Math.random() * 6 }));
  let f = 0;
  (function tick() {
    g.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.vy += .45; p.x += p.vx; p.y += p.vy; p.r += .2; g.save(); g.translate(p.x, p.y); g.rotate(p.r);
      g.fillStyle = p.col; g.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); g.restore(); });
    if (++f < 110) requestAnimationFrame(tick); else c.remove();
  })();
}

function getPos() {

    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude }),
      () => res(null), { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });

async function resizeImg(file, max = 320) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', .85));
}

}

// ---- Payroll, staff profile, company profile ----
function monthInfo(d = new Date()) {
  const a = new Date(d.getFullYear(), d.getMonth(), 1), z = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  const f = x => x.toLocaleDateString('en-CA');
  return { start: a, startStr: f(a), endStr: f(z), label: a.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }) };
}
const workDays = logs => new Set(logs.map(l => new Date(l.clock_in_time).toLocaleDateString('en-CA'))).size;

async function payrollData() {
  const m = monthInfo();
  const [st, lg, pay] = await Promise.all([
    sb.from('staff').select('id,full_name,photo_url,status,days_to_pay,pay_amount').eq('company_id', companyId).order('full_name'),
    sb.from('staff_logs').select('staff_id,clock_in_time,total_hours_logged').eq('company_id', companyId).eq('current_status', 'Done').gte('clock_in_time', m.start.toISOString()),
    sb.from('payroll').select('*').eq('company_id', companyId).order('created_at', { ascending: false }).limit(100)
  ]);
  const err = [st, lg, pay].find(r => r.error);
  if (err) return { error: err.error };
  const rows = (st.data || []).filter(x => x.status !== 'Terminated').map(x => {
    const mine = (lg.data || []).filter(l => l.staff_id === x.id);
    const days = workDays(mine), need = x.days_to_pay || 0;
    const paid = (pay.data || []).some(p => p.staff_id === x.id && p.pay_period_start === m.startStr && p.status === 'Paid');
    return { ...x, days, need, paid, hrs: mine.reduce((a, l) => a + Number(l.total_hours_logged || 0), 0), ready: !paid && need > 0 && days >= need };
  });
  return { m, rows, pay: pay.data || [], names: Object.fromEntries((st.data || []).map(x => [x.id, x.full_name])) };
}

  const P = await payrollData();

async function createInvoice(btn) {
  const name = iv.client.trim();
  const items = iv.items.filter(x => x.name.trim() || Number(x.amount)).map(x => ({ name: x.name.trim() || iv.jtype, qty: 1, amount: Number(x.amount) || 0 }));
  const total = Math.round(items.reduce((a, x) => a + x.amount, 0) * 100) / 100;
  if (!name) { $('fmsg').textContent = 'Please enter the customer name.'; return; }
  if (total <= 0) { $('fmsg').textContent = 'Please add at least one item with an amount.'; return; }
  btn.disabled = true;
  let cl = pick.clients.find(c => c.client_name.toLowerCase() === name.toLowerCase());
  if (!cl) {
    const r = await sb.from('clients').insert({ company_id: companyId, client_name: name, address: iv.address.trim() || null }).select('id,client_name,address').single();
    if (r.error) return qErr(r.error, btn);
    cl = r.data;
  }
  const q = await sb.from('pricing_quotations').insert({ company_id: companyId, client_id: cl.id, cleaning_type: iv.jtype,
    ...Object.fromEntries(COSTS.map(k => [k, 0])), profit_margin: 0, final_price: total, created_at: new Date((iv.date || new Date().toLocaleDateString('en-CA')) + 'T12:00:00').toISOString() })
    .select('id,created_at').single();
  if (q.error) return qErr(q.error, btn);
  const d = await sb.from('quotation_details').insert({ company_id: companyId, pricing_quotation_id: q.data.id, client_id: cl.id, line_items: items,
    is_saved_as_invoice: true, invoice_status: 'Unpaid', due_date: iv.due || null, notes: iv.notes.trim() || null }).select('id').single();
  if (d.error) return qErr(d.error, btn);
  confetti(); toast('Invoice created ✨');
  showQuote({ id: q.data.id, detailId: d.data.id, clientId: cl.id, client: cl.client_name, type: iv.jtype, total, date: q.data.created_at, items,
    address: cl.address || iv.address, invoice: true, istatus: 'Unpaid', due: iv.due, notes: iv.notes });
}

    + ((rq.data || []).map(r => `<div class="row" style="display:block"><strong>${esc(r.full_name)}</strong><br><span class="mute">${esc(new Date(r.created_at).toLocaleDateString('en-GB'))}</span>
      <label style="margin-top:8px">Link to an existing staff record<select id="jl${r.id}"><option value="">New staff record</option>${free.map(x => `<option value="${x.id}">${esc(x.full_name)}</option>`).join('')}</select></label>
      <div style="display:flex;gap:8px;margin-top:10px"><button class="ghost" data-jr="${r.id},1" style="background:#16a34a;color:#fff;border:0">✅ Approve</button><button class="ghost" data-jr="${r.id},0">✖ Reject</button></div></div>`).join('')
      || '<p class="mute">No requests right now. 🎉</p>');
}
async function reviewJoin(v) {
  const [id, ok] = v.split(',');
  const sel = $('jl' + id);
  const r = await sb.rpc('review_join', { p_id: Number(id), p_approve: ok === '1', p_staff_id: sel && sel.value ? Number(sel.value) : null });
  if (r.error) return fail(r.error);
  toast(ok === '1' ? 'Staff approved ✅' : 'Request rejected'); loadJoins();
}

$('body').addEventListener('click', e => { if (e.target.closest('#cibtn')) $('cipanel').hidden = !$('cipanel').hidden; });
// ---- Agencies: deactivate, activate, delete (platform owner) ----
let agList = [];
async function loadAgencies() {
  const r = await sb.from('companies').select('id,company_name,logo_url,status,created_at').order('created_at', { ascending: false });
  if (r.error) return fail(r.error);
  agList = r.data || [];
  const chip = { active: '🟢 Active', pending: '⏳ Pending', rejected: '✖ Rejected', inactive: '⏸ Inactive' };
  $('body').innerHTML = `<h2>🏢 Agencies</h2><p class="mute" style="margin-top:0">Deactivating blocks an agency without deleting its data. Deleting is permanent.</p>`
    + agList.map(c => `<div class="row" style="display:block"><div style="display:flex;align-items:center;gap:12px">${av(c.company_name, c.logo_url)}
      <div style="flex:1"><strong>${esc(c.company_name)}</strong><br><span class="mute">${chip[c.status] || esc(c.status)}</span></div></div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="ghost" data-ag="${c.id},${c.status === 'active' ? 'inactive' : 'active'}">${c.status === 'active' ? '⏸ Deactivate' : '▶ Activate'}</button>
        <button class="ghost" data-agdel="${c.id}" style="color:#ef4444">🗑 Delete</button></div></div>`).join('');
}
async function setAgency(v) {
  const [id, st] = v.split(',');
  const r = await sb.rpc('review_company', { p_id: Number(id), p_status: st });
  if (r.error) return fail(r.error);
  companies = companies.map(c => c.id === Number(id) ? { ...c, status: st } : c);
  toast(st === 'active' ? 'Agency activated ✅' : 'Agency deactivated ⏸'); loadAgencies();
}
async function deleteAgency(id) {
  const c = agList.find(x => x.id === id);
  if (!c) return;
  const typed = prompt(`This permanently deletes ${c.company_name} and ALL its data (staff, clients, invoices, payroll).\n\nType the agency name to confirm:`);
  if (!typed || typed.trim() !== c.company_name.trim()) { toast('Cancelled. Nothing was deleted.'); return; }
  const r = await sb.rpc('delete_company', { p_id: id });
  if (r.error) return fail(r.error);
  companies = companies.filter(x => x.id !== id);
  if (companyId === id && companies.length) companyId = companies[0].id;
  toast('Agency deleted 🗑'); loadAgencies();
}

$('menu').addEventListener('click', () => { $('nav').hidden = !$('nav').hidden; });
$('nav').addEventListener('click', e => {
  const b = e.target.closest('[data-nav]');
  if (!b) return;
  editing = false; $('nav').hidden = true; mode = b.dataset.nav; load();
});

$('lf').addEventListener('submit', async e => {
  e.preventDefault();
  $('lmsg').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  if (error) { $('lmsg').textContent = 'Sign-in failed: ' + error.message; return; }
  $('pw').value = '';
  showApp();
});
$('co').addEventListener('change', e => { editing = false; companyId = Number(e.target.value); load(); });
$('tab').addEventListener('click', () => { editing = false; mode = mode === 'shift' ? 'dash' : 'shift'; load(); });
$('out').addEventListener('click', async () => { await sb.auth.signOut(); showLogin(); });

(async () => {
  const { data } = await sb.auth.getSession();
  data.session ? showApp() : showLogin();
})();
</script>
</body>
</html>
