<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SyncStaff</title>
<style>
:root{--bg:#0a0a0b;--card:#131315;--line:#26262b;--text:#f3f3f4;--mute:#9b9ba3;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--blue:#60a5fa;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main,.wrap{max-width:640px;margin:0 auto}
h1{font-size:1.9rem;line-height:1.1;margin:20px 0 4px;font-weight:700}
.mute{color:var(--mute)}
input,select,button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
button{cursor:pointer;background:var(--text);color:#0a0a0b;font-weight:600;border:0}
button.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);width:auto}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
form{display:grid;gap:12px;margin-top:24px}
.bar{display:flex;gap:8px;align-items:center;padding-top:12px}
#out{margin-left:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat b{display:block;font-size:2rem;line-height:1.1}
.stat span{color:var(--mute);font-size:.9rem}
h2{font-size:1.1rem;margin:28px 0 10px}
.row{background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px}
.Working{border-left-color:var(--warn)}.Done{border-left-color:var(--ok)}.Ontheway{border-left-color:var(--blue)}
.msg{margin:12px 0;color:var(--bad)}
</style>
</head>
<body>
<main id="login" hidden>
  <h1>SyncStaff</h1>
  <p class="mute">Sign in to your company’s workspace.</p>
  <form id="lf">
    <input id="em" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button>Sign in</button>
  </form>
  <p class="msg" id="lmsg"></p>
</main>

<main id="app" hidden>
  <div class="bar">
    <select id="co" aria-label="Company"></select>
    <button class="ghost" id="out">Sign out</button>
  </div>
  <h1 id="title"></h1>
  <p class="mute" id="slogan"></p>
  <p class="mute" id="live"></p>
  <p class="msg" id="amsg"></p>
  <div id="body"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// 1) Paste your own values here (Supabase > Project Settings > API).
//    Use the anon (public) key only. NEVER paste the service_role key.
const SUPABASE_URL = 'https://gwnsrsngjqirctyuhcif.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3bnNyc25nanFpcmN0eXVoY2lmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMDcwNjYsImV4cCI6MjEwNzY4MzA2Nn0.YgUfpmyDyQjiAaBGPJt-1W7mnazEe9j9qZOaIn7Mu3M';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let companies = [], companyId = null, timer = null;

function showLogin() {
  clearInterval(timer);
  $('app').hidden = true; $('login').hidden = false;
}

async function showApp() {
  $('login').hidden = true; $('app').hidden = false;
  // Row Level Security returns only the companies this user may see.
  const { data, error } = await sb.from('companies').select('id,company_name,slogan').order('company_name');
  if (error) return fail(error);
  companies = data || [];
  if (!companies.length) {
    $('title').textContent = 'No company yet';
    $('body').innerHTML = '<p class="mute">Your account is not linked to a company. Ask the platform owner to add you.</p>';
    return;
  }
  $('co').innerHTML = companies.map(c => `<option value="${c.id}">${esc(c.company_name)}</option>`).join('');
  // Only the platform owner gets the company switcher.
  const { data: isOwner } = await sb.rpc('is_platform_owner');
  $('co').hidden = isOwner !== true;
  companyId = companies[0].id;
  $('co').value = companyId;
  await load();
  clearInterval(timer);
  timer = setInterval(load, 30000);
}

function fail(err) {
  $('amsg').textContent = 'Could not load data: ' + (err.message || err);
}

async function load() {
  const co = companies.find(c => c.id === companyId);
  if (!co) return;
  $('amsg').textContent = '';
  $('title').textContent = co.company_name;
  $('slogan').textContent = co.slogan || '';
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const today = new Date().toLocaleDateString('en-CA');
  const [st, lg, ui, sc, cl] = await Promise.all([
    sb.from('staff').select('id,full_name').eq('company_id', companyId),
    sb.from('staff_logs').select('*').eq('company_id', companyId)
      .gte('clock_in_time', start.toISOString()).order('clock_in_time', { ascending: false }),
    sb.from('urgent_issues').select('id', { count: 'exact', head: true })
      .eq('company_id', companyId).eq('status', 'Unresolved'),
    sb.from('schedules').select('*').eq('company_id', companyId)
      .gte('schedule_date', today).order('schedule_date').order('start_time').limit(5),
    sb.from('clients').select('id,client_name').eq('company_id', companyId)
  ]);
  const bad = [st, lg, ui, sc, cl].find(r => r.error);
  if (bad) return fail(bad.error);

  const names = Object.fromEntries((st.data || []).map(s => [s.id, s.full_name]));
  const clients = Object.fromEntries((cl.data || []).map(c => [c.id, c.client_name]));
  const logs = lg.data || [];
  const n = s => logs.filter(l => l.current_status === s).length;
  const time = t => t ? new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';

  $('live').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  $('body').innerHTML = `
    <div class="grid">
      <div class="stat"><b>${n('On the way')}</b><span>On the way</span></div>
      <div class="stat"><b>${n('Working')}</b><span>Working now</span></div>
      <div class="stat"><b>${n('Done')}</b><span>Done today</span></div>
      <div class="stat"><b>${ui.count ?? 0}</b><span>Urgent issues</span></div>
    </div>
    <h2>Staff today</h2>
    ${logs.length ? logs.map(l => `
      <div class="row ${esc(String(l.current_status).replace(/\s/g, ''))}">
        <div><strong>${esc(names[l.staff_id] || 'Staff member')}</strong><br><span class="mute">${esc(l.current_status)}</span></div>
        <span class="mute">${esc(time(l.clock_in_time))}</span>
      </div>`).join('') : '<p class="mute">No staff checked in today.</p>'}
    <h2>Upcoming schedule</h2>
    ${(sc.data || []).length ? sc.data.map(s => `
      <div class="row">
        <div><strong>${esc(clients[s.client_id] || 'Client')}</strong><br><span class="mute">${esc(names[s.assigned_staff_id] || 'Unassigned')}</span></div>
        <span class="mute">${esc(s.schedule_date)}<br>${esc((s.start_time || '').slice(0, 5))}</span>
      </div>`).join('') : '<p class="mute">No upcoming jobs.</p>'}`;
}

$('lf').addEventListener('submit', async e => {
  e.preventDefault();
  $('lmsg').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  if (error) { $('lmsg').textContent = 'Sign-in failed: ' + error.message; return; }
  $('pw').value = '';
  showApp();
});
$('co').addEventListener('change', e => { companyId = Number(e.target.value); load(); });
$('out').addEventListener('click', async () => { await sb.auth.signOut(); showLogin(); });

(async () => {
  const { data } = await sb.auth.getSession();
  data.session ? showApp() : showLogin();
})();
</script>
</body>
</html>
